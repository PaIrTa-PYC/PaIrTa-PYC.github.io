<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wormwaker 视频更新监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e6edf3;
        }

        .card {
            width: 420px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
        }

        .card h1 {
            font-size: 1.2em;
            margin-bottom: 6px;
        }

        .uid {
            font-size: 0.75em;
            color: #8b949e;
            margin-bottom: 24px;
        }

        /* 状态大图标 */
        .icon {
            font-size: 64px;
            margin: 20px 0;
        }

        .status-text {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .status-text.updated { color: #3fb950; }
        .status-text.no-update { color: #8b949e; }
        .status-text.error { color: #f85149; }

        .time-text {
            font-size: 0.75em;
            color: #484f58;
            margin-bottom: 20px;
        }

        /* 视频链接按钮 */
        .video-link {
            display: inline-block;
            padding: 10px 24px;
            background: #238636;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 500;
            transition: background 0.2s;
        }
        .video-link:hover { background: #2ea043; }

        .btn-refresh {
            display: block;
            margin: 24px auto 0;
            padding: 8px 20px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: background 0.2s;
        }
        .btn-refresh:hover { background: #30363d; }

        .loading { color: #8b949e; }

        .dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .dot.green { background: #3fb950; }
        .dot.gray { background: #484f58; }
        .dot.red { background: #f85149; }

        .footer {
            margin-top: 20px;
            font-size: 0.65em;
            color: #484f58;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>📺 Wormwaker 更新监控</h1>
    <div class="uid">UID: 3494361276877525</div>

    <div id="main">
        <div class="loading">加载中...</div>
    </div>

    <button class="btn-refresh" onclick="check()">🔄 刷新</button>

    <div class="footer" id="footer"></div>
</div>

<script>
const KEY = 'Wormwaker-update-video';
const URL = `https://textdb.online/${KEY}`;

async function check() {
    const main = document.getElementById('main');
    const footer = document.getElementById('footer');
    main.innerHTML = '<div class="loading">⏳ 正在读取...</div>';

    try {
        const resp = await fetch(URL, { cache: 'no-store' });
        const text = (await resp.text()).trim();

        if (!text) {
            main.innerHTML = `
                <div class="icon">📭</div>
                <div class="status-text no-update"><span class="dot gray"></span>暂无数据</div>
                <div class="time-text">尚未写入任何内容</div>
            `;
            return;
        }

        // 解析格式: "1;链接" 或 "0;链接"
        const semicolonIndex = text.indexOf(';');
        let flag, videoUrl;

        if (semicolonIndex === -1) {
            // 只有 1 或 0，没有链接
            flag = text.trim();
            videoUrl = '';
        } else {
            flag = text.substring(0, semicolonIndex).trim();
            videoUrl = text.substring(semicolonIndex + 1).trim();
        }

        const now = new Date().toLocaleString();
        footer.textContent = `最后查询: ${now}`;

        if (flag === '1') {
            // 有更新
            let linkHtml = '';
            if (videoUrl) {
                const href = videoUrl.startsWith('http') ? videoUrl : 'https://' + videoUrl;
                linkHtml = `<a class="video-link" href="${href}" target="_blank">▶ 前往观看</a>`;
            }
            main.innerHTML = `
                <div class="icon">🎉</div>
                <div class="status-text updated"><span class="dot green"></span>有新视频更新！</div>
                <div class="time-text">${videoUrl || ''}</div>
                ${linkHtml}
            `;
        } else if (flag === '0') {
            // 没更新
            let linkHtml = '';
            if (videoUrl) {
                const href = videoUrl.startsWith('http') ? videoUrl : 'https://' + videoUrl;
                linkHtml = `<a class="video-link" href="${href}" target="_blank">▶ 查看最新视频</a>`;
            }
            main.innerHTML = `
                <div class="icon"></div>
                <div class="status-text no-update"><span class="dot gray"></span>暂无新视频</div>
                <div class="time-text">${videoUrl || ''}</div>
                ${linkHtml}
            `;
        } else {
            // 格式异常
            main.innerHTML = `
                <div class="icon">⚠️</div>
                <div class="status-text error">数据格式异常</div>
                <div class="time-text">原始内容: ${text}</div>
            `;
        }

    } catch (e) {
        main.innerHTML = `
            <div class="icon">❌</div>
            <div class="status-text error"><span class="dot red"></span>请求失败</div>
            <div class="time-text">${e.message}</div>
        `;
    }
}

// 初始加载
check();

// 每60秒自动刷新
setInterval(check, 60 * 1000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漂流瓶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0ea5e9',
                        secondary: '#06b6d4',
                        accent: '#38bdf8',
                    },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .ocean-bg { background: linear-gradient(180deg, #0c4a6e 0%, #0284c7 50%, #38bdf8 100%);} 
            .wave-animation { animation: wave 3s ease-in-out infinite; }
            @keyframes wave { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
            .float-animation { animation: float 4s ease-in-out infinite; }
            @keyframes float {0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-15px) rotate(2deg);} }
            .bottle-glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.3);} 
            .input-focus { @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none; }
            .btn-primary { @apply bg-gradient-to-r from-primary to-secondary text-white px-6 py-3 rounded-xl font-medium shadow-lg shadow-primary/25 hover:shadow-xl hover:shadow-primary/30 transform hover:-translate-y-0.5 transition-all duration-200; }
            .btn-secondary { @apply bg-white/20 text-white px-6 py-3 rounded-xl font-medium border border-white/30 hover:bg-white/30 transform hover:-translate-y-0.5 transition-all duration-200; }
        }
    </style>
</head>
<body class="font-inter min-h-screen ocean-bg flex items-center justify-center p-4 overflow-hidden">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-blue-400/30 to-transparent wave-animation"></div>
        <div class="absolute bottom-10 left-10 w-20 h-20 bg-white/10 rounded-full blur-xl"></div>
        <div class="absolute bottom-20 right-20 w-32 h-32 bg-white/10 rounded-full blur-xl"></div>
        <div class="absolute top-20 left-1/4 w-16 h-16 bg-white/5 rounded-full blur-lg"></div>
    </div>

    <div class="w-full max-w-lg relative z-10">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white/20 rounded-full mb-4 backdrop-blur-sm float-animation">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">漂流瓶</h1>
            <p class="text-white/80">Wormwaker是给</p>
        </div>

        <div class="bottle-glass rounded-3xl p-8 shadow-2xl">
            <div class="flex gap-2 mb-6">
                <button onclick="switchTab('send')" id="sendTab" class="flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-primary text-white">📤 扔漂流瓶</button>
                <button onclick="switchTab('pick')" id="pickTab" class="flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-gray-100 text-gray-600">🧺 捡漂流瓶</button>
            </div>

            <div id="sendSection">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">写下你的留言</label>
                    <textarea id="bottleContent" rows="5" placeholder="写下你想说的话" class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus transition-all duration-200 resize-none bg-white/50"></textarea>
                    <div class="flex justify-between items-center mt-1">
                        <label class="text-xs text-gray-500"><input id="anonymousChk" type="checkbox" checked class="mr-2"> 匿名</label>
                        <p class="text-xs text-gray-500"><span id="bottleCharCount">0</span> 字符</p>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">显示名字（若不匿名）</label>
                    <input id="senderName" type="text" placeholder="你的名字（可选）" class="w-full px-4 py-2 border border-gray-200 rounded-xl input-focus bg-white/50" />
                </div>

                <button onclick="sendBottle()" class="btn-primary w-full flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                    扔出漂流瓶
                </button>
            </div>

            <div id="pickSection" class="hidden">
                <div id="loadingState" class="hidden text-center py-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                        <svg class="w-8 h-8 text-primary animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </div>
                    <p class="text-gray-600">正在搜寻漂流瓶...</p>
                </div>

                <div id="emptyState" class="text-center py-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 rounded-full mb-4">
                        <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                        </svg>
                    </div>
                    <p class="text-gray-600 mb-4">还没有捡到漂流瓶</p>
                    <button onclick="pickBottle()" class="btn-primary">去海里捞一个</button>
                </div>

                <div id="foundState" class="hidden">
                    <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-xl p-6 mb-6">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-2xl">🍾</span>
                            <span class="text-sm font-medium text-amber-700">你捡到了一个漂流瓶！</span>
                        </div>
                        <p id="bottleMessage" class="text-gray-700 whitespace-pre-wrap"></p>
                        <div class="mt-4 pt-4 border-t border-amber-200">
                            <p id="messageMeta" class="text-xs text-amber-600">来自：匿名</p>
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="pickBottle()" class="btn-primary flex-1 flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            再捞一个
                        </button>
                        <button onclick="throwBack()" class="btn-secondary flex-1 flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            扔回海里
                        </button>
                    </div>
                </div>
            </div>

            <div id="statusMessage" class="mt-6 hidden">
                <div id="statusContent" class="p-4 rounded-xl text-sm"></div>
            </div>

            <div class="mt-6 pt-6 border-t border-gray-200">
                <div class="flex justify-center gap-8 text-center">
                    <div>
                        <p class="text-2xl font-bold text-gray-700" id="todayCount">--</p>
                        <p class="text-xs text-gray-500">今日漂流瓶</p>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-gray-700" id="yourPickCount">0</p>
                        <p class="text-xs text-gray-500">你捡到的</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-6 text-white/60 text-sm">Powered by TextDB.online</div>
    </div>

    <script>
        const API_UPDATE = 'https://api.textdb.online/update';
        const API_GET = 'https://textdb.online';

        const bottleContent = document.getElementById('bottleContent');
        const bottleCharCount = document.getElementById('bottleCharCount');
        const yourPickCountEl = document.getElementById('yourPickCount');
        const todayCountEl = document.getElementById('todayCount');

        bottleContent.addEventListener('input', () => { bottleCharCount.textContent = bottleContent.value.length; });

        // Cookie helpers
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days*24*60*60*1000));
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
        }
        function getCookie(name) {
            const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
            return v ? decodeURIComponent(v.pop()) : null;
        }

        // Read-tracking: use localStorage primarily (more reliable on GitHub Pages). Migrate from cookie if present.
        function getReadBottles(){
            try{
                const ls = localStorage.getItem('readBottles');
                if(ls){
                    const arr = JSON.parse(ls);
                    if(Array.isArray(arr)) return arr.map(x => Number(x)).filter(n => !isNaN(n));
                }
                // migrate from cookie if localStorage empty
                const c = getCookie('readBottles');
                if(!c) return [];
                const carr = JSON.parse(c);
                if(!Array.isArray(carr)) return [];
                const nums = carr.map(x => Number(x)).filter(n => !isNaN(n));
                localStorage.setItem('readBottles', JSON.stringify(nums));
                return nums;
            }catch(e){ return []; }
        }
        function addReadBottle(n){
            try{
                const num = Number(n);
                if(isNaN(num)) return;
                const arr = getReadBottles();
                if(!arr.includes(num)) arr.push(num);
                // save to localStorage and cookie for compatibility
                localStorage.setItem('readBottles', JSON.stringify(arr));
                setCookie('readBottles', JSON.stringify(arr), 365);
            }catch(e){}
        }

        // next key index stored locally, start from 1
        function getNextIndex() { return parseInt(localStorage.getItem('nextBottleIndex') || '1', 10); }
        function setNextIndex(n) { localStorage.setItem('nextBottleIndex', String(n)); }

        // track pick count
        let pickCount = parseInt(localStorage.getItem('pickCount') || '0', 10);
        yourPickCountEl.textContent = pickCount;

        function showStatus(message, type='info'){
            const statusMessage = document.getElementById('statusMessage');
            const statusContent = document.getElementById('statusContent');
            statusMessage.classList.remove('hidden');
            const colors = {
                success: 'bg-green-50 text-green-700 border border-green-200',
                error: 'bg-red-50 text-red-700 border border-red-200',
                info: 'bg-blue-50 text-blue-700 border border-blue-200',
                warning: 'bg-yellow-50 text-yellow-700 border border-yellow-200'
            };
            statusContent.className = `p-4 rounded-xl text-sm ${colors[type] || colors.info}`;
            statusContent.textContent = message;
            setTimeout(()=>{ statusMessage.classList.add('hidden'); }, 3000);
        }

        function switchTab(tab){
            const sendSection = document.getElementById('sendSection');
            const pickSection = document.getElementById('pickSection');
            const sendTab = document.getElementById('sendTab');
            const pickTab = document.getElementById('pickTab');
            if(tab==='send'){ sendSection.classList.remove('hidden'); pickSection.classList.add('hidden'); sendTab.className = 'flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-primary text-white'; pickTab.className='flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-gray-100 text-gray-600'; }
            else { sendSection.classList.add('hidden'); pickSection.classList.remove('hidden'); sendTab.className='flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-gray-100 text-gray-600'; pickTab.className='flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-primary text-white'; }
        }

        async function fetchTextKey(key){
            try{
                // timeout to avoid hanging requests
                const controller = new AbortController();
                const timeoutId = setTimeout(()=> controller.abort(), 8000);
                console.debug('fetchTextKey ->', key);
                const r = await fetch(`${API_GET}/${encodeURIComponent(key)}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                if(!r.ok){
                    console.warn('fetchTextKey non-ok', key, r.status);
                    return null;
                }
                const t = await r.text();
                if(!t || t.trim()==='') return null;
                return t;
            }catch(e){
                console.error('fetchTextKey error', key, e && e.name ? e.name : e);
                return null;
            }
        }

        async function postKey(key, value){
            try{
                const url = `${API_UPDATE}?key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}`;
                const r = await fetch(url, { method: 'POST' });
                if(!r.ok){ console.warn('postKey non-ok', key, r.status); return null; }
                const j = await r.json().catch(()=>null);
                return j;
            }catch(e){ console.error('postKey error', key, e); return null; }
        }

        // Page Index helpers
        async function getPageIndex(){
            const t = await fetchTextKey('Page Index');
            if(!t) return 0;
            const n = parseInt(t,10);
            return isNaN(n)?0:n;
        }
        async function setPageIndex(n){
            await postKey('Page Index', String(n));
        }
        async function incrementPageIndex(){
            const cur = await getPageIndex();
            const next = cur + 1;
            await setPageIndex(next);
            return next;
        }

        async function sendBottle(){
            const content = bottleContent.value;
            const anonymous = document.getElementById('anonymousChk') ? document.getElementById('anonymousChk').checked : true;
            const name = document.getElementById('senderName') ? document.getElementById('senderName').value.trim() : '';
            if(!content || content.trim()===''){ showStatus('漂流瓶不能是空的哦，写点什么吧','error'); return; }
            showStatus('正在把漂流瓶扔进大海...','info');
            try{
                // increment Page Index on server and get number
                const nextIdx = await incrementPageIndex();
                const key = `bottle-${nextIdx}`;
                let payload = content;
                if(!anonymous && name) payload = content + '\n\n— ' + name;

                const res = await postKey(key, payload);
                if(res && (res.status===1 || res.status==='1')){
                    bottleContent.value=''; bottleCharCount.textContent='0';
                    setNextIndex(nextIdx+1);
                    todayCountEl.textContent = String(nextIdx);
                    showStatus('\uD83C\uDF89 漂流瓶已成功扔进大海','success');
                }else{
                    // if failed, roll back Page Index (best-effort)
                    await setPageIndex(Math.max(0, (await getPageIndex()) - 1));
                    showStatus('扔漂流瓶失败，再试试吧','error');
                }
            }catch(e){ console.error(e); showStatus('网络错误','error'); }
        }

        // Pick bottle: read Page Index, then randomly pick within [1, pageIndex] excluding already-read stored in cookie
        // seen contents dedupe using localStorage
        function getSeenContents(){
            try{
                const s = localStorage.getItem('seenContents');
                if(!s) return [];
                const arr = JSON.parse(s);
                if(!Array.isArray(arr)) return [];
                return arr.map(x => String(x));
            }catch(e){ return []; }
        }
        function addSeenContent(text){
            try{
                const t = (text || '').trim();
                if(!t) return;
                const arr = getSeenContents();
                if(!arr.includes(t)) arr.push(t);
                localStorage.setItem('seenContents', JSON.stringify(arr));
            }catch(e){}
        }

        async function pickBottle(){
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const foundState = document.getElementById('foundState');
            const messageMeta = document.getElementById('messageMeta');
            loadingState.classList.remove('hidden'); emptyState.classList.add('hidden'); foundState.classList.add('hidden');

            const pageIndex = await getPageIndex();
            if(!pageIndex || pageIndex <= 0){
                loadingState.classList.add('hidden'); emptyState.classList.remove('hidden'); showStatus('当前没有可用的漂流瓶','warning');
                return;
            }

            let candidates = [];
            for(let i=1;i<=pageIndex;i++) candidates.push(i);
            const read = getReadBottles();
            candidates = candidates.filter(n => !read.includes(n));

            if(candidates.length === 0){
                loadingState.classList.add('hidden'); emptyState.classList.remove('hidden'); showStatus('你已经看过所有漂流瓶啦','info');
                return;
            }

            showStatus('正在从可用漂流瓶中随机抽取...');
            console.debug('pickBottle candidates count:', candidates.length);

            const seenContents = getSeenContents();

            // attempt up to candidates.length times
            let attempts = Math.min(candidates.length, 200);
            for(let attempt=0; attempt<attempts; attempt++){
                const pickIndex = Math.floor(Math.random()*candidates.length);
                const idx = candidates[pickIndex];
                const key = `bottle-${idx}`;
                console.debug('pickBottle trying', key);
                const content = await fetchTextKey(key);
                if(content){
                    const trimmed = content.trim();
                    // skip if content already seen (dedupe by content)
                    if(seenContents.includes(trimmed)){
                        console.debug('content already seen, marking read and skipping', key);
                        addReadBottle(idx);
                        candidates.splice(pickIndex,1);
                        if(candidates.length === 0) break;
                        continue;
                    }

                    document.getElementById('bottleMessage').textContent = content;
                    // determine sender meta
                    let meta = '匿名';
                    const lines = content.split('\n');
                    const last = lines[lines.length-1];
                    if(last && last.startsWith('— ')) meta = last.substring(2);
                    messageMeta.textContent = '来自：' + meta;

                    loadingState.classList.add('hidden'); emptyState.classList.add('hidden'); foundState.classList.remove('hidden');
                    pickCount++; localStorage.setItem('pickCount', String(pickCount)); yourPickCountEl.textContent = pickCount;

                    // mark as read and seen
                    addReadBottle(idx);
                    addSeenContent(trimmed);
                    return;
                } else {
                    // remove this idx from candidates if empty
                    console.debug('pickBottle empty for', key);
                    candidates.splice(pickIndex,1);
                    if(candidates.length === 0) break;
                }
                // update status occasionally to show progress
                if(attempt % 6 === 0) showStatus(`尝试中... 已尝试 ${attempt+1} 次，剩余候选 ${candidates.length}`);
                await new Promise(r=>setTimeout(r, 120));
            }

            loadingState.classList.add('hidden'); emptyState.classList.remove('hidden'); foundState.classList.add('hidden');
            showStatus('没有找到可用的漂流瓶，稍后再来试试','warning');
        }

        function throwBack(){ pickBottle(); }

        // init
        document.addEventListener('DOMContentLoaded', async ()=>{
            // ensure next index exists
            if(!localStorage.getItem('nextBottleIndex')) localStorage.setItem('nextBottleIndex','1');
            const idx = await getPageIndex();
            todayCountEl.textContent = String(idx);
            // ensure anonymous checkbox exists
            const anon = document.getElementById('anonymousChk');
            if(anon){
                document.getElementById('senderName').disabled = anon.checked;
                anon.addEventListener('change', (e)=>{ document.getElementById('senderName').disabled = e.target.checked; });
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漂流瓶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0ea5e9',
                        secondary: '#06b6d4',
                        accent: '#38bdf8',
                    },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .ocean-bg { background: linear-gradient(180deg, #0c4a6e 0%, #0284c7 50%, #38bdf8 100%);} 
            .wave-animation { animation: wave 3s ease-in-out infinite; }
            @keyframes wave { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
            .float-animation { animation: float 4s ease-in-out infinite; }
            @keyframes float {0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-15px) rotate(2deg);} }
            .bottle-glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.3);} 
            .input-focus { @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none; }
            .btn-primary { @apply bg-gradient-to-r from-primary to-secondary text-white px-6 py-3 rounded-xl font-medium shadow-lg shadow-primary/25 hover:shadow-xl hover:shadow-primary/30 transform hover:-translate-y-0.5 transition-all duration-200; }
        }
    </style>
</head>
<body class="font-inter min-h-screen ocean-bg flex items-center justify-center p-4 overflow-auto">
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-blue-400/30 to-transparent wave-animation"></div>
        <div class="absolute bottom-10 left-10 w-20 h-20 bg-white/10 rounded-full blur-xl"></div>
        <div class="absolute bottom-20 right-20 w-32 h-32 bg-white/10 rounded-full blur-xl"></div>
        <div class="absolute top-20 left-1/4 w-16 h-16 bg-white/5 rounded-full blur-lg"></div>
    </div>

    <div class="w-full max-w-lg relative z-10">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white/60 rounded-full mb-4 backdrop-blur-sm float-animation">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">漂流瓶</h1>
            <p class="text-white/80">Wormwaker是给</p>
        </div>

        <div class="bottle-glass rounded-3xl p-8 shadow-2xl">
            <!-- Tabs -->
            <div class="flex gap-2 mb-6">
                <button onclick="switchTab('send')" id="sendTab" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-primary text-white">📤 扔漂流瓶</button>
                <button onclick="switchTab('pick')" id="pickTab" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-gray-100 text-gray-600">🧺 捡漂流瓶</button>
                <button onclick="switchTab('history')" id="historyTab" class="tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-gray-100 text-gray-600">📜 历史</button>
            </div>

            <!-- 扔漂流瓶 -->
            <div id="sendSection">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">写下你的留言</label>
                    <textarea id="bottleContent" rows="5" placeholder="写下你想说的话" class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus transition-all duration-200 resize-none bg-white/50"></textarea>
                    <div class="flex justify-between items-center mt-1">
                        <label class="text-xs text-gray-500"><input id="anonymousChk" type="checkbox" checked class="mr-2"> 匿名</label>
                        <p class="text-xs text-gray-500"><span id="bottleCharCount">0</span> 字符</p>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">显示名字（若不匿名）</label>
                    <input id="senderName" type="text" placeholder="你的名字（可选）" class="w-full px-4 py-2 border border-gray-200 rounded-xl input-focus bg-white/50" />
                </div>
                <button onclick="sendBottle()" class="btn-primary w-full flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                    扔出漂流瓶
                </button>
            </div>

            <!-- 捡漂流瓶 -->
            <div id="pickSection" class="hidden">
                <!-- 加载状态 -->
                <div id="pickLoading" class="hidden text-center py-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                        <svg class="w-8 h-8 text-primary animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                    </div>
                    <p class="text-gray-600">正在搜寻漂流瓶...</p>
                </div>

                <!-- 初始状态 -->
                <div id="pickIdle" class="text-center py-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 rounded-full mb-4">
                        <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                        </svg>
                    </div>
                    <p class="text-gray-600 mb-4">还没有捡到漂流瓶</p>
                    <button id="pickBtn" onclick="pickBottle()" class="btn-primary">去海里捞一个</button>
                </div>

                <!-- 捡到瓶子 -->
                <div id="pickFound" class="hidden">
                    <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-xl p-6 mb-6">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-2xl">🍾</span>
                            <span class="text-sm font-medium text-amber-700">你捡到了一个漂流瓶！</span>
                        </div>
                        <p id="bottleMessage" class="text-gray-700 whitespace-pre-wrap"></p>
                        <div class="mt-4 pt-4 border-t border-amber-200">
                            <p id="messageMeta" class="text-xs text-amber-600">来自：匿名</p>
                        </div>
                    </div>
                    <button id="pickAgainBtn" onclick="pickBottle()" class="btn-primary w-full flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        再捞一个
                    </button>
                </div>

                <!-- 全部捡完 -->
                <div id="pickDone" class="hidden text-center py-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-4">
                        <span class="text-3xl">🎉</span>
                    </div>
                    <p class="text-gray-700 font-medium mb-2">你已经捡完了所有漂流瓶！</p>
                    <p class="text-gray-500 text-sm">由于代码问题，如果你新扔出了一个漂流瓶，你需要刷新网页才能获取</p>
                </div>
            </div>

            <!-- 历史 -->
            <div id="historySection" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-medium text-gray-700">已捡到的瓶子 (<span id="historyCount">0</span>)</h3>
                    <button onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-600 transition-colors">清空记录</button>
                </div>
                <div id="historyList" class="space-y-3 max-h-96 overflow-y-auto"></div>
                <div id="historyEmpty" class="text-center py-8 text-gray-400">
                    <p>还没有捡过漂流瓶</p>
                </div>
            </div>

            <!-- 状态消息 -->
            <div id="statusMessage" class="mt-6 hidden">
                <div id="statusContent" class="p-4 rounded-xl text-sm"></div>
            </div>

            <!-- 统计 -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <div class="flex justify-center gap-8 text-center">
                    <div>
                        <p class="text-2xl font-bold text-gray-700" id="statTotal">--</p>
                        <p class="text-xs text-gray-500">总漂流瓶</p>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-gray-700" id="statPicked">0</p>
                        <p class="text-xs text-gray-500">你捡到的</p>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-gray-700" id="statRemain">--</p>
                        <p class="text-xs text-gray-500">剩余可捡</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-6 text-white/60 text-sm">Powered by TextDB.online</div>
    </div>

    <script>
        const API_UPDATE = 'https://api.textdb.online/update';
        const API_GET = 'https://textdb.online';

        let totalBottles = 0;

        // ===== DOM refs =====
        const $ = id => document.getElementById(id);

        // ===== Cookie =====
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + days*86400000);
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
        }

        // ===== localStorage helpers =====
        function getReadBottles() {
            try {
                const s = localStorage.getItem('readBottles');
                if (!s) return [];
                const arr = JSON.parse(s);
                return Array.isArray(arr) ? arr.filter(n => Number.isInteger(n) && n > 0) : [];
            } catch(e) { return []; }
        }

        function saveReadBottles(arr) {
            localStorage.setItem('readBottles', JSON.stringify(arr));
        }

        function addReadBottle(n) {
            const arr = getReadBottles();
            if (!arr.includes(n)) {
                arr.push(n);
                arr.sort((a, b) => a - b);
                saveReadBottles(arr);
            }
        }

        function getHistory() {
            try {
                const s = localStorage.getItem('bottleHistory');
                if (!s) return [];
                const arr = JSON.parse(s);
                return Array.isArray(arr) ? arr : [];
            } catch(e) { return []; }
        }

        function addToHistory(idx, content, meta) {
            const arr = getHistory();
            if (arr.some(item => item.id === idx)) return;
            arr.unshift({ id: idx, content, from: meta, time: new Date().toLocaleString('zh-CN') });
            localStorage.setItem('bottleHistory', JSON.stringify(arr));
        }

        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ===== 状态显示 =====
        function showStatus(msg, type = 'info') {
            const el = $('statusMessage');
            const content = $('statusContent');
            el.classList.remove('hidden');
            const colors = {
                success: 'bg-green-50 text-green-700 border border-green-200',
                error: 'bg-red-50 text-red-700 border border-red-200',
                info: 'bg-blue-50 text-blue-700 border border-blue-200',
                warning: 'bg-yellow-50 text-yellow-700 border border-yellow-200'
            };
            content.className = `p-4 rounded-xl text-sm ${colors[type] || colors.info}`;
            content.textContent = msg;
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        // ===== 界面状态管理（互斥显示） =====
        function showPickState(state) {
            $('pickLoading').classList.add('hidden');
            $('pickIdle').classList.add('hidden');
            $('pickFound').classList.add('hidden');
            $('pickDone').classList.add('hidden');

            if (state === 'loading') $('pickLoading').classList.remove('hidden');
            else if (state === 'idle') $('pickIdle').classList.remove('hidden');
            else if (state === 'found') $('pickFound').classList.remove('hidden');
            else if (state === 'done') $('pickDone').classList.remove('hidden');
        }

        // ===== 统计更新 =====
        function updateStats() {
            const readArr = getReadBottles();
            const validCount = readArr.filter(n => n >= 1 && n <= totalBottles).length;
            $('statTotal').textContent = totalBottles || '--';
            $('statPicked').textContent = validCount;
            $('statRemain').textContent = totalBottles > 0 ? Math.max(0, totalBottles - validCount) : '--';
        }

        // ===== Tab =====
        function switchTab(tab) {
            const activeCls = 'tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-primary text-white';
            const inactiveCls = 'tab-btn flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-all duration-200 bg-gray-100 text-gray-600';

            $('sendTab').className = inactiveCls;
            $('pickTab').className = inactiveCls;
            $('historyTab').className = inactiveCls;
            $('sendSection').classList.add('hidden');
            $('pickSection').classList.add('hidden');
            $('historySection').classList.add('hidden');

            if (tab === 'send') {
                $('sendTab').className = activeCls;
                $('sendSection').classList.remove('hidden');
            } else if (tab === 'pick') {
                $('pickTab').className = activeCls;
                $('pickSection').classList.remove('hidden');
                checkPickDone();
            } else if (tab === 'history') {
                $('historyTab').className = activeCls;
                $('historySection').classList.remove('hidden');
                renderHistory();
            }
        }

        // ===== 检查是否全部捡完 =====
        function checkPickDone() {
            if (totalBottles <= 0) {
                showPickState('idle');
                return;
            }
            const readArr = getReadBottles();
            const validCount = readArr.filter(n => n >= 1 && n <= totalBottles).length;
            if (validCount >= totalBottles) {
                showPickState('done');
            }
            // 如果不是 done，保持当前状态不变
        }

        // ===== API =====
        async function fetchKey(key) {
            try {
                const controller = new AbortController();
                const tid = setTimeout(() => controller.abort(), 8000);
                const r = await fetch(`${API_GET}/${encodeURIComponent(key)}`, { signal: controller.signal });
                clearTimeout(tid);
                if (!r.ok) return null;
                const t = await r.text();
                return (t && t.trim() !== '') ? t : null;
            } catch(e) { return null; }
        }

        async function postKey(key, value) {
            try {
                const url = `${API_UPDATE}?key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}`;
                const r = await fetch(url, { method: 'POST' });
                if (!r.ok) return null;
                return await r.json().catch(() => null);
            } catch(e) { return null; }
        }

        async function getTotalBottles() {
            const t = await fetchKey('Page Index');
            return t ? (parseInt(t, 10) || 0) : 0;
        }

        // ===== 扔漂流瓶 =====
        async function sendBottle() {
            const content = $('bottleContent').value.trim();
            const anonymous = $('anonymousChk')?.checked ?? true;
            const name = $('senderName')?.value.trim() || '';

            if (!content) {
                showStatus('漂流瓶不能是空的哦', 'error');
                return;
            }

            showStatus('正在扔漂流瓶...', 'info');

            let payload = content;
            if (!anonymous && name) payload += '\n\n— ' + name;

            const cur = await getTotalBottles();
            const nextIdx = cur + 1;
            const key = `bottle-${nextIdx}`;

            const res = await postKey(key, payload);
            if (res && (res.status === 1 || res.status === '1')) {
                await postKey('Page Index', String(nextIdx));
                $('bottleContent').value = '';
                $('bottleCharCount').textContent = '0';
                totalBottles = nextIdx;
                updateStats();
                showStatus('🎉 漂流瓶已成功扔进大海', 'success');
            } else {
                showStatus('扔漂流瓶失败，再试试吧', 'error');
            }
        }

        // ===== 捡漂流瓶 =====
        async function pickBottle() {
            showPickState('loading');

            const pageIndex = await getTotalBottles();
            totalBottles = pageIndex;
            updateStats();

            if (!pageIndex) {
                showPickState('idle');
                showStatus('海里还没有漂流瓶', 'warning');
                return;
            }

            // 构建可用列表
            const readSet = new Set(getReadBottles().filter(n => n >= 1 && n <= pageIndex));
            const available = [];
            for (let i = 1; i <= pageIndex; i++) {
                if (!readSet.has(i)) available.push(i);
            }

            // 全部捡完
            if (available.length === 0) {
                showPickState('done');
                return;
            }

            // 洗牌
            for (let i = available.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [available[i], available[j]] = [available[j], available[i]];
            }

            let netFails = 0;

            for (const idx of available) {
                if (netFails >= 3) break;

                const key = `bottle-${idx}`;
                let content = null;
                let ok = false;

                try {
                    const controller = new AbortController();
                    const tid = setTimeout(() => controller.abort(), 8000);
                    const resp = await fetch(`${API_GET}/${encodeURIComponent(key)}`, { signal: controller.signal });
                    clearTimeout(tid);
                    if (resp.ok) {
                        ok = true;
                        const t = await resp.text();
                        if (t && t.trim() !== '') content = t;
                    }
                } catch(e) {
                    ok = false;
                }

                if (!ok) { netFails++; continue; }

                // 空瓶子标记已读跳过
                if (!content) {
                    addReadBottle(idx);
                    continue;
                }

                // 解析来源
                let meta = '匿名';
                const lines = content.split('\n');
                const lastLine = lines[lines.length - 1];
                if (lastLine && lastLine.startsWith('— ')) meta = lastLine.substring(2);

                // 显示
                $('bottleMessage').textContent = content;
                $('messageMeta').textContent = '来自：' + meta;
                showPickState('found');

                // 记录
                addReadBottle(idx);
                addToHistory(idx, content, meta);
                updateStats();
                return;
            }

            // 循环结束没找到
            updateStats();
            const readArr = getReadBottles();
            const validCount = readArr.filter(n => n >= 1 && n <= totalBottles).length;
            if (validCount >= totalBottles) {
                showPickState('done');
            } else if (netFails >= 3) {
                showPickState('idle');
                showStatus('网络不太稳定，请稍后再试', 'warning');
            } else {
                showPickState('idle');
                showStatus('没有找到可用的漂流瓶', 'info');
            }
        }

        // ===== 历史 =====
        function renderHistory() {
            const arr = getHistory();
            $('historyCount').textContent = arr.length;

            if (arr.length === 0) {
                $('historyList').innerHTML = '';
                $('historyEmpty').classList.remove('hidden');
                return;
            }
            $('historyEmpty').classList.add('hidden');
            $('historyList').innerHTML = arr.map(item => `
                <div class="bg-gray-50 border border-gray-100 rounded-xl p-4">
                    <p class="text-sm text-gray-700 whitespace-pre-wrap mb-2">${escapeHtml(item.content)}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-gray-400">来自：${escapeHtml(item.from)}</span>
                        <span class="text-xs text-gray-300">${item.time}</span>
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (!confirm('确定要清空所有历史记录和已读状态吗？')) return;
            localStorage.removeItem('bottleHistory');
            localStorage.removeItem('readBottles');
            renderHistory();
            updateStats();
            showPickState('idle');
            showStatus('已清空', 'info');
        }

        // ===== 定时刷新 =====
        async function refreshTotal() {
            const count = await getTotalBottles();
            if (count !== totalBottles) {
                totalBottles = count;
                updateStats();
                // 如果之前是 done 状态，现在有新瓶子了，切回 idle
                if (!$('pickDone').classList.contains('hidden') && count > getReadBottles().filter(n => n >= 1 && n <= count).length) {
                    showPickState('idle');
                }
            }
        }

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', async () => {
            // 清除旧数据
            localStorage.removeItem('seenContents');
            localStorage.removeItem('nextBottleIndex');
            localStorage.removeItem('pickCount');

            totalBottles = await getTotalBottles();
            updateStats();

            // 检查是否已捡完
            checkPickDone();

            // 匿名复选框
            const anon = $('anonymousChk');
            if (anon) {
                $('senderName').disabled = anon.checked;
                anon.addEventListener('change', e => {
                    $('senderName').disabled = e.target.checked;
                });
            }

            // 每分钟刷新
            setInterval(refreshTotal, 60000);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载页面</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .download-container {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
        }
        .file-list {
            list-style: none;
            padding: 0;
        }
        .file-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .file-list li:last-child {
            border-bottom: none;
        }
        .file-name {
            font-size: 14px;
            color: #333;
        }
        .btn-download {
            background: #0070f3;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-download:hover {
            background: #005bb5;
        }
        .btn-download-all {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-download-all:hover {
            background: #218838;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 9999;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="download-container">
    <h2>📦 文件下载</h2>
    <ul class="file-list" id="fileList">
        <li>加载中...</li>
    </ul>
    <button class="btn-download-all" onclick="downloadAll()">⬇️ 下载全部文件</button>
</div>

<div class="toast" id="toast"></div>

<script>
    // ===== 配置 =====
    const MANIFEST_URL = './download/manifest.json';

    let fileList = [];

    // ===== 加载文件列表 =====
    async function loadFileList() {
        const listEl = document.getElementById('fileList');
        try {
            const resp = await fetch(MANIFEST_URL);
            if (!resp.ok) throw new Error('manifest.json 不存在或无法访问');
            const data = await resp.json();
            fileList = data.files || [];

            if (fileList.length === 0) {
                listEl.innerHTML = '<li>暂无文件</li>';
                return;
            }

            listEl.innerHTML = fileList.map((name, i) => `
                <li>
                    <span class="file-name">📄 ${name}</span>
                    <button class="btn-download" onclick="downloadSingle(${i})">下载</button>
                </li>
            `).join('');

        } catch (e) {
            listEl.innerHTML = '<li style="color:red;">加载失败：' + e.message + '</li>';
        }
    }

    // ===== 下载单个文件 =====
    function downloadSingle(index) {
        const fileName = fileList[index];
        triggerDownload(fileName);
        showToast('✅ 开始下载: ' + fileName);
    }

    // ===== 下载全部文件 =====
    function downloadAll() {
        if (fileList.length === 0) {
            showToast('⚠️ 没有可下载的文件');
            return;
        }

        showToast('⬇️ 开始下载 ' + fileList.length + ' 个文件...');

        // 逐个触发下载，间隔 500ms 避免浏览器拦截
        fileList.forEach((fileName, i) => {
            setTimeout(() => {
                triggerDownload(fileName);
            }, i * 500);
        });
    }

    // ===== 触发下载（核心函数）=====
    function triggerDownload(fileName) {
        const encodedName = encodeURIComponent(fileName);
        const url = './download/' + encodedName;

        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // ===== Toast 提示 =====
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ===== 页面加载时获取文件列表 =====
    loadFileList();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaIrTa_PYC的小站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #6c63ff;
            --accent-light: #8b83ff;
            --accent-glow: rgba(108, 99, 255, 0.3);
            --gradient-1: linear-gradient(135deg, #6c63ff, #e942f5);
            --gradient-2: linear-gradient(135deg, #f97316, #ef4444);
            --gradient-3: linear-gradient(135deg, #06b6d4, #3b82f6);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a14;
            --bg-secondary: #12121f;
            --bg-card: #1a1a2e;
            --text-primary: #eeeef5;
            --text-secondary: #9d9db5;
            --text-muted: #55556e;
            --border: rgba(255, 255, 255, 0.06);
            --nav-bg: rgba(10, 10, 20, 0.8);
            --blob-opacity: 0.14;
        }

        [data-theme="light"] {
            --bg-primary: #f0f0f8;
            --bg-secondary: #e8e8f2;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8a8aa0;
            --border: rgba(0, 0, 0, 0.08);
            --nav-bg: rgba(240, 240, 248, 0.85);
            --blob-opacity: 0.18;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* NexusChat 风格背景 */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg i {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: var(--blob-opacity);
            animation: fl 20s ease-in-out infinite alternate;
        }

        .bg i:nth-child(1) {
            width: 520px;
            height: 520px;
            background: #6c5ce7;
            top: -12%;
            left: -6%;
        }

        .bg i:nth-child(2) {
            width: 420px;
            height: 420px;
            background: #00cec9;
            bottom: -10%;
            right: -6%;
            animation-delay: -7s;
        }

        .bg i:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #fd79a8;
            top: 45%;
            left: 55%;
            animation-delay: -13s;
        }

        @keyframes fl {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, -25px) scale(1.08); }
            100% { transform: translate(-20px, 30px) scale(0.94); }
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        nav.scrolled {
            padding: 0.7rem 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gradient-1);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* ===== 主题开关 ===== */
        .theme-switch {
            position: relative;
            width: 52px;
            height: 28px;
            cursor: pointer;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .switch-slider {
            position: absolute;
            inset: 0;
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            transition: all 0.35s ease;
        }

        .switch-slider::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            top: 50%;
            left: 3px;
            transform: translateY(-50%);
            background: var(--accent);
            box-shadow: 0 2px 8px var(--accent-glow);
            transition: all 0.35s cubic-bezier(0.68, -0.3, 0.32, 1.3);
        }

        .theme-switch input:checked + .switch-slider::before {
            left: calc(100% - 23px);
            background: #f59e0b;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }

        .theme-switch:hover .switch-slider {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* 英雄区 - 全屏 */
        .hero {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            max-width: 800px;
            text-align: center;
            position: relative;
            z-index: 1;
            padding: 0 2rem;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            min-height: 1.3em;
        }

        .hero h1 .gradient-text {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background: var(--accent);
            margin-left: 4px;
            vertical-align: text-bottom;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* 通用section */
        section {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .section-tag {
            display: inline-block;
            color: var(--accent-light);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        /* 公告板块 */
        .announcement-box {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .announcement-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-1);
        }

        .announcement-content {
            color: var(--text-primary);
            font-size: 1.05rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .announcement-content.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        .announcement-loading {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: var(--text-muted);
        }

        .announcement-loading .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 个人项目 */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .project-card {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* ===== 与"与我联系"一致的悬停效果 ===== */
        .project-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        /* ===== 点击/按下效果 ===== */
        .project-card:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .project-image {
            height: 180px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .project-card:nth-child(1) .project-image {
            background: linear-gradient(135deg, #1a1a3e, #2d1b69);
        }

        .project-card:nth-child(2) .project-image {
            background: linear-gradient(135deg, #0f2027, #203a43);
        }

        .project-card:nth-child(3) .project-image {
            background: linear-gradient(135deg, #1a0a2e, #3b1d5e);
        }

        .project-info {
            padding: 1.8rem;
        }

        .project-info h3 {
            font-size: 1.3rem;
            margin-bottom: 0.6rem;
        }

        .project-info p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }

        .project-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            background: var(--gradient-1);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            border: none;
            cursor: pointer;
        }

        .project-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .project-btn:active {
            transform: translateY(0) scale(0.97);
        }

        /* 联系 */
        .contact-section {
            text-align: center;
        }

        .contact-cards {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .contact-card {
            padding: 1.5rem 2.5rem;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
        }

        .contact-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .contact-card:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .contact-card .icon {
            font-size: 1.5rem;
        }

        .contact-card .label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
            position: relative;
            z-index: 1;
        }

        footer .heart {
            color: #ef4444;
        }

        /* Toast 提示 */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--text-primary);
            font-size: 0.85rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            animation: toastIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.hide {
            animation: toastOut 0.3s ease forwards;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(30px); }
        }

        /* 动画 */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 2.2rem;
            }

            .section-header h2 {
                font-size: 2rem;
            }

            .contact-cards {
                flex-direction: column;
                align-items: center;
            }
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
</head>
<body>
    <!-- NexusChat 风格背景 -->
    <div class="bg"><i></i><i></i><i></i></div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 导航栏 -->
    <nav id="navbar">
        <div class="nav-container">
            <div class="logo">PaIrTa_PYC的小站</div>
            <ul class="nav-links">
                <li><a href="#home">主页</a></li>
                <li><a href="#projects">个人项目</a></li>
                <li><a href="#announcement">公告</a></li>
                <li><a href="#contact">联系我</a></li>
                <li>
                    <label class="theme-switch">
                        <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                        <span class="switch-slider"></span>
                    </label>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 英雄区 - 全屏 -->
    <div class="hero" id="home">
        <div class="hero-content">
            <h1>
                <span class="gradient-text" id="typing-text"></span><span class="typing-cursor"></span>
            </h1>
            <p>我用最简单最直白的话告诉你，你好</p>
        </div>
    </div>

    <!-- 个人项目 -->
    <section id="projects">
        <div class="section-header fade-in">
            <span class="section-tag">Projects</span>
            <h2>个人项目</h2>
            <p>一些小项目</p>
        </div>
        <div class="projects-grid">
            <div class="project-card fade-in">
                <div class="project-image">🍾</div>
                <div class="project-info">
                    <h3>漂流瓶</h3>
                    <p>一个漂流瓶网页，写下你的心事投入大海</p>
                    <a href="./bottle/index.html" class="project-btn" target="_blank">访问网站</a>
                </div>
            </div>
            <div class="project-card fade-in">
                <div class="project-image">💬</div>
                <div class="project-info">
                    <h3>NexusChat 聊天室</h3>
                    <p>一个实时在线聊天室，支持多人同时在线交流，简洁轻量的聊天体验</p>
                    <a href="./irc/index.html" class="project-btn" target="_blank">访问网站</a>
                </div>
            </div>
            <!-- ===== 新增 zako~ 卡片 ===== -->
            <div class="project-card fade-in">
                <div class="project-image">🍥</div>
                <div class="project-info">
                    <h3>zako~</h3>
                    <p>自动为你的消息添加后缀</p>
                    <button class="project-btn" onclick="downloadZako()">立即下载</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 公告 -->
    <section id="announcement">
        <div class="section-header fade-in">
            <span class="section-tag">Announcement</span>
            <h2> 公告</h2>
            <p>最新动态与通知</p>
        </div>
        <div class="announcement-box fade-in">
            <div id="announcement-content" class="announcement-loading">
                <div class="spinner"></div>
                <span>加载中...</span>
            </div>
        </div>
    </section>

    <!-- 联系 -->
    <section id="contact" class="contact-section">
        <div class="section-header fade-in">
            <span class="section-tag">Contact</span>
            <h2>与我联系</h2>
            <p></p>
        </div>
        <div class="contact-cards fade-in">
            <a href="https://github.com/PaIrTa-PYC" class="contact-card" target="_blank">
                <span class="label">GitHub</span>
            </a>
            <a href="https://space.bilibili.com/652131791" class="contact-card" target="_blank">
                <span class="label">Bilibili</span>
            </a>
            <div class="contact-card" onclick="copyToClipboard('3834554060', 'QQ号')">
                <span class="label">QQ</span>
            </div>
            <div class="contact-card" onclick="copyToClipboard('3834554060@qq.com', 'Email')">
                <span class="label">Email</span>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>© 2026 PaIrTa_PYC<span class="heart"></span></p>
    </footer>

    <script>
        // 禁止右键
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 刷新后始终回到顶部
        window.addEventListener('DOMContentLoaded', () => {
            window.scrollTo(0, 0);
        });
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        // ===== 主题切换 =====
        function toggleTheme() {
            const html = document.documentElement;
            const checkbox = document.getElementById('themeToggle');
            if (checkbox.checked) {
                html.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // 初始化主题
        (function() {
            const saved = localStorage.getItem('theme');
            const checkbox = document.getElementById('themeToggle');
            if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                checkbox.checked = true;
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                checkbox.checked = false;
            }
        })();

        // ===== 复制到剪贴板 =====
        function copyToClipboard(text, label) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ ' + label + ' 已复制: ' + text);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✅ ' + label + ' 已复制: ' + text);
            });
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ===== zako~ 下载功能 =====
        async function downloadZako() {
            showToast('请稍后');
            try {
                const resp = await fetch('./download/');
                if (!resp.ok) throw new Error('错误：目录不可访问');
                const html = await resp.text();
                // 从目录列表中提取 .zip 文件名
                const match = html.match(/href="([^"]*\.zip)"/i);
                if (match) {
                    const fileName = match[1].replace(/^\.\//, '');
                    const a = document.createElement('a');
                    a.href = './download/' + fileName;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    showToast('✅ 开始下载: ' );
                } else {
                    showToast('⚠️ 未找到文件');
                }
            } catch (e) {
                // 如果服务器不支持目录列表，尝试常见文件名
                showToast('✅ 开始下载');
                const a = document.createElement('a');
                a.href = './download/zako~ 1.0.0.zip';
                a.download = 'zako~ 1.0.0.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        // ===== 打字删除动画 =====
        const names = ['PaIrTa_PYC', '琳沐ou'];
        let nameIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let isPausing = false;
        const typingSpeed = 100;
        const deletingSpeed = 60;
        const pauseTime = 2000;

        const typingElement = document.getElementById('typing-text');

        function typeEffect() {
            const currentName = names[nameIndex];

            if (!isDeleting && !isPausing) {
                charIndex++;
                typingElement.textContent = currentName.substring(0, charIndex);

                if (charIndex === currentName.length) {
                    isPausing = true;
                    setTimeout(typeEffect, pauseTime);
                    return;
                }
                setTimeout(typeEffect, typingSpeed);

            } else if (isPausing) {
                isPausing = false;
                isDeleting = true;
                setTimeout(typeEffect, deletingSpeed);

            } else if (isDeleting) {
                charIndex--;
                typingElement.textContent = currentName.substring(0, charIndex);

                if (charIndex === 0) {
                    isDeleting = false;
                    nameIndex = (nameIndex + 1) % names.length;
                    setTimeout(typeEffect, 300);
                    return;
                }
                setTimeout(typeEffect, deletingSpeed);
            }
        }

        typeEffect();

        // ===== 获取公告 =====
        async function fetchAnnouncement() {
            const container = document.getElementById('announcement-content');
            try {
                const response = await fetch('https://textdb.online/GongGao123');
                const text = await response.text();

                if (text && text.trim() !== '' && text.trim() !== 'Not Found') {
                    container.className = 'announcement-content';
                    container.textContent = text.trim();
                } else {
                    container.className = 'announcement-content empty';
                    container.textContent = '暂无公告';
                }
            } catch (error) {
                container.className = 'announcement-content empty';
                container.textContent = '暂无公告';
            }
        }

        fetchAnnouncement();

        // ===== 导航栏滚动效果 =====
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        // ===== 滚动渐入动画 =====
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        });

        document.querySelectorAll('.fade-in').forEach(el => {
            observer.observe(el);
        });

        // ===== 平滑滚动 =====
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站维护中</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        dark: '#0f172a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .bg-gradient-main {
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            }
            .animate-float {
                animation: float 4s ease-in-out infinite;
            }
            @keyframes float {
                0%,100% {transform: translateY(0px);}
                50% {transform: translateY(-16px);}
            }
        }
    </style>
</head>
<body class="bg-gradient-main min-h-screen flex items-center justify-center px-6 font-sans overflow-hidden">
    <!-- 背景装饰圆点 -->
    <div class="absolute w-80 h-80 bg-primary/10 rounded-full blur-3xl -top-40 -left-40"></div>
    <div class="absolute w-72 h-72 bg-emerald-400/10 rounded-full blur-3xl -bottom-36 -right-36"></div>

    <div class="relative z-10 max-w-xl text-center">
        <!-- 齿轮图标 -->
        <div class="animate-float mb-8">
            <i class="fa fa-cog fa-spin text-[5rem] text-primary/80"></i>
        </div>

        <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold text-white mb-4">
            网站维护中
        </h1>
        <p class="text-slate-300 text-lg leading-relaxed">
            我们正在重构网站
        </p>
    </div>
</body>
</html>

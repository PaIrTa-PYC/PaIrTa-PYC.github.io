
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextDB 文本存储工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                        accent: '#06b6d4',
                    },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .gradient-bg {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            .glass-effect {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
            }
            .btn-primary {
                @apply bg-gradient-to-r from-primary to-secondary text-white px-6 py-3 rounded-xl font-medium shadow-lg shadow-primary/25 hover:shadow-xl hover:shadow-primary/30 transform hover:-translate-y-0.5 transition-all duration-200;
            }
            .btn-secondary {
                @apply bg-white text-gray-700 px-6 py-3 rounded-xl font-medium shadow-lg border border-gray-200 hover:shadow-xl hover:border-gray-300 transform hover:-translate-y-0.5 transition-all duration-200;
            }
            .btn-danger {
                @apply bg-gradient-to-r from-red-500 to-pink-500 text-white px-6 py-3 rounded-xl font-medium shadow-lg shadow-red-500/25 hover:shadow-xl hover:shadow-red-500/30 transform hover:-translate-y-0.5 transition-all duration-200;
            }
        }
    </style>
</head>
<body class="font-inter min-h-screen gradient-bg flex items-center justify-center p-4">
    <div class="w-full max-w-2xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-2xl mb-4 backdrop-blur-sm">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">TextDB 文本存储工具</h1>
            <p class="text-white/80">简单高效的在线文本存储服务</p>
        </div>

        <!-- Main Card -->
        <div class="glass-effect rounded-3xl p-8 shadow-2xl">
            <!-- Key Input -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <span class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.943L13 13H9v2l-3 3V13H4l-1-1a6 6 0 1111.743-5.943z"></path>
                        </svg>
                        数据标识 Key
                    </span>
                </label>
                <div class="flex gap-3">
                    <input 
                        type="text" 
                        id="keyInput" 
                        placeholder="输入你的数据标识，例如：my-note-123"
                        class="flex-1 px-4 py-3 border border-gray-200 rounded-xl input-focus transition-all duration-200 bg-white/50"
                        value="123456"
                    >
                    <button onclick="generateRandomKey()" class="btn-secondary flex items-center gap-2 whitespace-nowrap">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        随机生成
                    </button>
                </div>
                <p class="text-xs text-gray-500 mt-1">这个Key将用于唯一标识你的数据，随机生成可提高安全性</p>
            </div>

            <!-- Text Area -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <span class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        文本内容
                    </span>
                </label>
                <textarea 
                    id="textInput" 
                    rows="8" 
                    placeholder="在这里输入你想要保存的文本内容..."
                    class="w-full px-4 py-4 border border-gray-200 rounded-xl input-focus transition-all duration-200 resize-none bg-white/50"
                ></textarea>
                <div class="flex justify-between items-center mt-1">
                    <p class="text-xs text-gray-500">支持最多20万字符</p>
                    <p class="text-xs text-gray-500"><span id="charCount">0</span> 字符</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-3">
                <button onclick="saveData()" class="btn-primary flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                    </svg>
                    保存
                </button>
                <button onclick="loadData()" class="btn-secondary flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                    读取
                </button>
                <button onclick="deleteData()" class="btn-danger flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    删除
                </button>
            </div>

            <!-- Encryption Buttons -->
            <div class="mt-4 pt-4 border-t border-gray-200">
                <p class="text-sm text-gray-600 mb-3">🔐 哈基米加密工具</p>
                <div class="flex flex-wrap gap-3">
                    <button onclick="hajimiEncrypt()" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg shadow-purple-500/25 hover:shadow-xl hover:shadow-purple-500/30 transform hover:-translate-y-0.5 transition-all duration-200 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        哈基米加密
                    </button>
                    <button onclick="hajimiDecrypt()" class="bg-gradient-to-r from-cyan-500 to-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg shadow-cyan-500/25 hover:shadow-xl hover:shadow-cyan-500/30 transform hover:-translate-y-0.5 transition-all duration-200 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
                        </svg>
                        哈基米解密
                    </button>
                </div>
            </div>

            <!-- Status Message -->
            <div id="statusMessage" class="mt-6 hidden">
                <div id="statusContent" class="p-4 rounded-xl text-sm"></div>
            </div>

            <!-- API Info -->
            <div class="mt-8 pt-6 border-t border-gray-200">
                <details class="group">
                    <summary class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer hover:text-gray-800 transition-colors">
                        <svg class="w-4 h-4 transform group-open:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                        API 接口信息
                    </summary>
                    <div class="mt-4 space-y-2 text-xs text-gray-600">
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <span class="font-medium text-green-600">创建/更新：</span>
                            <code class="block mt-1 text-gray-800 break-all">POST https://api.textdb.online/update?key=YOUR_KEY&value=YOUR_CONTENT</code>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <span class="font-medium text-blue-600">读取：</span>
                            <code class="block mt-1 text-gray-800 break-all">GET https://textdb.online/YOUR_KEY</code>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <span class="font-medium text-red-600">删除：</span>
                            <code class="block mt-1 text-gray-800 break-all">POST https://api.textdb.online/update?key=YOUR_KEY&value=</code>
                        </div>
                    </div>
                </details>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-white/60 text-sm">
            Powered by TextDB.online
        </div>
    </div>

    <script>
        // Character counter
        const textInput = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        
        textInput.addEventListener('input', function() {
            charCount.textContent = this.value.length;
        });

        // Show status message
        function showStatus(message, type = 'info') {
            const statusMessage = document.getElementById('statusMessage');
            const statusContent = document.getElementById('statusContent');
            
            statusMessage.classList.remove('hidden');
            
            const colors = {
                success: 'bg-green-50 text-green-700 border border-green-200',
                error: 'bg-red-50 text-red-700 border border-red-200',
                info: 'bg-blue-50 text-blue-700 border border-blue-200',
                warning: 'bg-yellow-50 text-yellow-700 border border-yellow-200'
            };
            
            statusContent.className = `p-4 rounded-xl text-sm ${colors[type]}`;
            statusContent.textContent = message;
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 5000);
        }

        // Save data
        async function saveData() {
            const key = document.getElementById('keyInput').value.trim();
            const value = document.getElementById('textInput').value;
            
            if (!key) {
                showStatus('请输入数据标识 Key', 'error');
                return;
            }
            
            if (!value || value.trim() === '') {
                showStatus('错误的长度：文本内容不能为空', 'error');
                return;
            }
            
            try {
                showStatus('正在保存数据...', 'info');
                
                const response = await fetch(`https://api.textdb.online/update?key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    }
                });
                
                if (response.ok) {
                    showStatus('数据保存成功！', 'success');
                } else {
                    showStatus('保存失败，请稍后重试', 'error');
                }
            } catch (error) {
                console.error('Save error:', error);
                showStatus('网络错误，请检查网络连接', 'error');
            }
        }

        // Load data
        async function loadData() {
            const key = document.getElementById('keyInput').value.trim();
            
            if (!key) {
                showStatus('请输入数据标识 Key', 'error');
                return;
            }
            
            try {
                showStatus('正在读取数据...', 'info');
                
                const response = await fetch(`https://textdb.online/${encodeURIComponent(key)}`);
                
                if (response.ok) {
                    const data = await response.text();
                    document.getElementById('textInput').value = data;
                    charCount.textContent = data.length;
                    showStatus('数据读取成功！', 'success');
                } else if (response.status === 404) {
                    showStatus('无效的Key', 'error');
                    document.getElementById('textInput').value = '';
                    charCount.textContent = '0';
                } else {
                    showStatus('读取失败，请稍后重试', 'error');
                }
            } catch (error) {
                console.error('Load error:', error);
                showStatus('网络错误，请检查网络连接', 'error');
            }
        }

        // Delete data
        async function deleteData() {
            const key = document.getElementById('keyInput').value.trim();
            
            if (!key) {
                showStatus('请输入数据标识 Key', 'error');
                return;
            }
            
            if (!confirm('确定要删除这条数据吗？此操作不可恢复。')) {
                return;
            }
            
            try {
                showStatus('正在删除数据...', 'info');
                
                const response = await fetch(`https://api.textdb.online/update?key=${encodeURIComponent(key)}&value=`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    }
                });
                
                if (response.ok) {
                    document.getElementById('textInput').value = '';
                    charCount.textContent = '0';
                    showStatus('数据删除成功！', 'success');
                } else {
                    showStatus('删除失败，请稍后重试', 'error');
                }
            } catch (error) {
                console.error('Delete error:', error);
                showStatus('网络错误，请检查网络连接', 'error');
            }
        }

        // Generate random key
        function generateRandomKey() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789-_';
            let key = '';
            // Generate 20 character random key for better security
            for (let i = 0; i < 20; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('keyInput').value = key;
            showStatus('已生成随机安全Key！', 'success');
        }

        // Hajimi encryption/decryption
        const hajimiChars = ['哈', '基', '米'];
        
        // Hajimi Encrypt
        function hajimiEncrypt() {
            const text = document.getElementById('textInput').value;
            if (!text || text.trim() === '') {
                showStatus('错误的长度：文本内容不能为空', 'error');
                return;
            }
            
            try {
                // Convert text to UTF-8 bytes
                const encoder = new TextEncoder();
                const bytes = encoder.encode(text);
                
                let result = '';
                
                // Convert each byte to 5 ternary digits
                for (const byte of bytes) {
                    let n = byte;
                    // Convert to base 3, 5 digits
                    for (let i = 0; i < 5; i++) {
                        const remainder = n % 3;
                        n = Math.floor(n / 3);
                        result = hajimiChars[remainder] + result;
                    }
                }
                
                document.getElementById('textInput').value = result;
                charCount.textContent = result.length;
                showStatus('哈基米加密成功！', 'success');
            } catch (error) {
                console.error('Encryption error:', error);
                showStatus('加密失败，请重试', 'error');
            }
        }
        
        // Hajimi Decrypt
        function hajimiDecrypt() {
            const text = document.getElementById('textInput').value;
            if (!text || text.trim() === '') {
                showStatus('错误的长度：文本内容不能为空', 'error');
                return;
            }
            
            // Check if all characters are hajimi chars
            for (const c of text) {
                if (!hajimiChars.includes(c)) {
                    showStatus('无效的哈基米密文，包含未知字符', 'error');
                    return;
                }
            }
            
            if (text.length % 5 !== 0) {
                showStatus('无效的哈基米密文，长度必须是5的倍数', 'error');
                return;
            }
            
            try {
                const bytes = [];
                
                // Process 5 characters at a time
                for (let i = 0; i < text.length; i += 5) {
                    let byte = 0;
                    for (let j = 0; j < 5; j++) {
                        const c = text[i + j];
                        const val = hajimiChars.indexOf(c);
                        byte = byte * 3 + val;
                    }
                    bytes.push(byte);
                }
                
                // Convert bytes back to text
                const decoder = new TextDecoder();
                const result = decoder.decode(new Uint8Array(bytes));
                
                document.getElementById('textInput').value = result;
                charCount.textContent = result.length;
                showStatus('哈基米解密成功！', 'success');
            } catch (error) {
                console.error('Decryption error:', error);
                showStatus('解密失败，密文可能已损坏', 'error');
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + S to save
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveData();
            }
        });
    </script>
</body>
</html>

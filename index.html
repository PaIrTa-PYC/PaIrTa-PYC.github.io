<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaIrTa_PYC的小站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --accent: #6c63ff;
            --accent-light: #8b83ff;
            --accent-glow: rgba(108, 99, 255, 0.3);
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0b0;
            --text-muted: #6a6a7a;
            --border: #2a2a3e;
            --gradient-1: linear-gradient(135deg, #6c63ff, #e942f5);
            --gradient-2: linear-gradient(135deg, #f97316, #ef4444);
            --gradient-3: linear-gradient(135deg, #06b6d4, #3b82f6);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 全屏背景动画 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at 30% 20%, rgba(108, 99, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(233, 66, 245, 0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(108, 99, 255, 0.03) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.02); }
            66% { transform: translate(-20px, 20px) scale(0.98); }
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        nav.scrolled {
            padding: 0.7rem 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gradient-1);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* 英雄区 - 全屏 */
        .hero {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            max-width: 800px;
            text-align: center;
            position: relative;
            z-index: 1;
            padding: 0 2rem;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            min-height: 1.3em;
        }

        .hero h1 .gradient-text {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background: var(--accent);
            margin-left: 4px;
            vertical-align: text-bottom;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* 通用section */
        section {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .section-tag {
            display: inline-block;
            color: var(--accent-light);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        /* 公告板块 */
        .announcement-box {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .announcement-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-1);
        }

        .announcement-content {
            color: var(--text-primary);
            font-size: 1.05rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .announcement-content.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        .announcement-loading {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: var(--text-muted);
        }

        .announcement-loading .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 技能 - 单卡片居中 */
        .skills-single {
            display: flex;
            justify-content: center;
        }

        .skill-card {
            padding: 2.5rem 3rem;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
            min-width: 280px;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-1);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 40px rgba(108, 99, 255, 0.1);
        }

        .skill-card:hover::before {
            opacity: 1;
        }

        .skill-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.2rem;
            background: rgba(108, 99, 255, 0.15);
        }

        .skill-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .skill-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 个人项目 */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .project-card {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border-color: var(--accent);
        }

        .project-image {
            height: 180px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .project-card:nth-child(1) .project-image {
            background: linear-gradient(135deg, #1a1a3e, #2d1b69);
        }

        .project-card:nth-child(2) .project-image {
            background: linear-gradient(135deg, #0f2027, #203a43);
        }

        .project-info {
            padding: 1.8rem;
        }

        .project-info h3 {
            font-size: 1.3rem;
            margin-bottom: 0.6rem;
        }

        .project-info p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }

        .project-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            background: var(--gradient-1);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .project-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        /* 联系 */
        .contact-section {
            text-align: center;
        }

        .contact-cards {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .contact-card {
            padding: 1.5rem 2.5rem;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .contact-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .contact-card .icon {
            font-size: 1.5rem;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
            position: relative;
            z-index: 1;
        }

        footer .heart {
            color: #ef4444;
        }

        /* 动画 */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 2.2rem;
            }

            .section-header h2 {
                font-size: 2rem;
            }
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav id="navbar">
        <div class="nav-container">
            <div class="logo">PaIrTa_PYC的小站</div>
            <ul class="nav-links">
                <li><a href="#skills">我会干啥</a></li>
                <li><a href="#projects">个人项目</a></li>
                <li><a href="#announcement">公告</a></li>
                <li><a href="#contact">联系我</a></li>
            </ul>
        </div>
    </nav>

    <!-- 英雄区 - 全屏 -->
    <div class="hero" id="home">
        <div class="hero-content">
            <h1>
                <span class="gradient-text" id="typing-text"></span><span class="typing-cursor"></span>
            </h1>
            <p>我用最简单最直白的话告诉你，你好</p>
        </div>
    </div>

    <!-- 技能 -->
    <section id="skills">
        <div class="section-header fade-in">
            <span class="section-tag">Skills</span>
            <h2>技术栈</h2>
            <p></p>
        </div>
        <div class="skills-single fade-in">
            <div class="skill-card">
                <div class="skill-icon">C</div>
                <h3>C++</h3>
                <p>简单的Windows桌面应用开发</p>
            </div>
        </div>
    </section>

    <!-- 个人项目 -->
    <section id="projects">
        <div class="section-header fade-in">
            <span class="section-tag">Projects</span>
            <h2>个人项目</h2>
            <p>一些小项目</p>
        </div>
        <div class="projects-grid">
            <div class="project-card fade-in">
                <div class="project-image">🍾</div>
                <div class="project-info">
                    <h3>漂流瓶</h3>
                    <p>一个漂流瓶网页，写下你的心事投入大海</p>
                    <a href="./bottle/index.html" class="project-btn">访问网站</a>
                </div>
            </div>
            <div class="project-card fade-in">
                <div class="project-image">💬</div>
                <div class="project-info">
                    <h3>NexusChat 聊天室</h3>
                    <p>一个实时在线聊天室，支持多人同时在线交流</p>
                    <a href="./irc/index.html" class="project-btn">访问网站</a>
                </div>
            </div>
        </div>
    </section>

    <!-- 公告（倒数第二，在联系上面） -->
    <section id="announcement">
        <div class="section-header fade-in">
            <span class="section-tag">Announcement</span>
            <h2>📢 公告</h2>
            <p>最新动态与通知</p>
        </div>
        <div class="announcement-box fade-in">
            <div id="announcement-content" class="announcement-loading">
                <div class="spinner"></div>
                <span>加载中...</span>
            </div>
        </div>
    </section>

    <!-- 联系 -->
    <section id="contact" class="contact-section">
        <div class="section-header fade-in">
            <span class="section-tag">Contact</span>
            <h2>与我联系</h2>
            <p></p>
        </div>
        <div class="contact-cards fade-in">
            <a href="https://github.com/PaIrTa-PYC" class="contact-card">
                <span>GitHub</span>
            <a href="https://space.bilibili.com/652131791" class="contact-card">
                <span>Bilibili</span>
            </a>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>© 2026 PaIrTa_PYC<span class="heart"></span></p>
    </footer>

    <script>
        // 刷新后始终回到顶部
        window.addEventListener('DOMContentLoaded', () => {
            window.scrollTo(0, 0);
        });
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        // 打字删除动画
        const names = ['PaIrTa_PYC', '琳沐ou'];
        let nameIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let isPausing = false;
        const typingSpeed = 100;
        const deletingSpeed = 60;
        const pauseTime = 2000;

        const typingElement = document.getElementById('typing-text');

        function typeEffect() {
            const currentName = names[nameIndex];

            if (!isDeleting && !isPausing) {
                charIndex++;
                typingElement.textContent = currentName.substring(0, charIndex);

                if (charIndex === currentName.length) {
                    isPausing = true;
                    setTimeout(typeEffect, pauseTime);
                    return;
                }
                setTimeout(typeEffect, typingSpeed);

            } else if (isPausing) {
                isPausing = false;
                isDeleting = true;
                setTimeout(typeEffect, deletingSpeed);

            } else if (isDeleting) {
                charIndex--;
                typingElement.textContent = currentName.substring(0, charIndex);

                if (charIndex === 0) {
                    isDeleting = false;
                    nameIndex = (nameIndex + 1) % names.length;
                    setTimeout(typeEffect, 300);
                    return;
                }
                setTimeout(typeEffect, deletingSpeed);
            }
        }

        typeEffect();

        // 获取公告
        async function fetchAnnouncement() {
            const container = document.getElementById('announcement-content');
            try {
                const response = await fetch('https://textdb.online/GongGao123');
                const text = await response.text();

                if (text && text.trim() !== '' && text.trim() !== 'Not Found') {
                    container.className = 'announcement-content';
                    container.textContent = text.trim();
                } else {
                    container.className = 'announcement-content empty';
                    container.textContent = '暂无公告';
                }
            } catch (error) {
                container.className = 'announcement-content empty';
                container.textContent = '暂无公告';
            }
        }

        fetchAnnouncement();

        // 导航栏滚动效果
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        // 滚动渐入动画
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        });

        document.querySelectorAll('.fade-in').forEach(el => {
            observer.observe(el);
        });

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusChat · IRC</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg0:#0a0a14;--bg1:#12121f;--bg2:#1a1a2e;--bg3:#222240;
  --accent:#6c5ce7;--accent2:#a29bfe;--glow:rgba(108,92,231,.3);
  --green:#00cec9;--pink:#fd79a8;--red:#ff7675;--orange:#fdcb6e;
  --t1:#eeeef5;--t2:#9d9db5;--t3:#55556e;
  --border:rgba(255,255,255,.06);
  --r:14px;--shadow:0 8px 32px rgba(0,0,0,.4);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
  background:var(--bg0);color:var(--t1);height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(120px);opacity:.14;animation:fl 20s ease-in-out infinite alternate}
.bg i:nth-child(1){width:520px;height:520px;background:var(--accent);top:-12%;left:-6%}
.bg i:nth-child(2){width:420px;height:420px;background:var(--green);bottom:-10%;right:-6%;animation-delay:-7s}
.bg i:nth-child(3){width:300px;height:300px;background:var(--pink);top:45%;left:55%;animation-delay:-13s}
@keyframes fl{0%{transform:translate(0,0) scale(1)}50%{transform:translate(35px,-25px) scale(1.08)}100%{transform:translate(-20px,30px) scale(.94)}}

.screen{display:none;width:100%;height:100%;position:relative;z-index:1}
.screen.on{display:flex}

/* ===== LOBBY ===== */
#lobby{align-items:center;justify-content:center}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:22px;
  padding:44px 38px 36px;width:410px;max-width:92vw;text-align:center;
  box-shadow:var(--shadow),0 0 60px var(--glow);
  animation:up .5s cubic-bezier(.22,1,.36,1);
}
@keyframes up{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.card .logo{width:60px;height:60px;margin:0 auto 18px;background:linear-gradient(135deg,var(--accent),var(--green));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px}
.card h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--t1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card .sub{font-size:12px;color:var(--t3);margin:6px 0 28px}
.fg{text-align:left;margin-bottom:16px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:7px;text-transform:uppercase;letter-spacing:1px}
.fg input{
  width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--bg3);color:var(--t1);font-size:14px;outline:none;
  transition:border .2s,box-shadow .2s;
}
.fg input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.fg input::placeholder{color:var(--t3)}
.fg .hint-small{font-size:10px;color:var(--t3);margin-top:5px}
.btn-go{
  width:100%;padding:13px;border:none;border-radius:10px;margin-top:6px;
  background:linear-gradient(135deg,var(--accent),#8b7cf7);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px var(--glow);transition:transform .15s,box-shadow .15s;
}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 6px 22px var(--glow)}
.btn-go:disabled{opacity:.5;cursor:not-allowed;transform:none}

.btn-hall{
  width:100%;padding:13px;border:none;border-radius:10px;margin-top:10px;
  background:linear-gradient(135deg,var(--green),#00b894);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,206,201,.3);transition:transform .15s,box-shadow .15s;
}
.btn-hall:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,206,201,.3)}
.btn-hall:disabled{opacity:.5;cursor:not-allowed;transform:none}

.card .note{margin-top:20px;font-size:11px;color:var(--t3);line-height:1.7}

.fg .pass-wrap{position:relative}
.fg .pass-wrap input{padding-right:40px}
.fg .pass-wrap .lock-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.4}

/* ===== CHAT ===== */
#chat{flex-direction:column;height:100vh}
.bar{
  display:flex;align-items:center;gap:10px;padding:10px 18px;
  background:var(--bg1);border-bottom:1px solid var(--border);flex-shrink:0;
  position:relative;
}
.bar .ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--green));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff}
.bar .info{flex:1;min-width:0}
.bar .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .meta{font-size:10px;color:var(--t3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}
.btn-out{
  padding:7px 14px;border-radius:8px;border:1px solid rgba(255,118,117,.25);
  background:rgba(255,118,117,.08);color:var(--red);font-size:12px;font-weight:600;cursor:pointer;
}
.btn-out:hover{background:rgba(255,118,117,.18)}

.room-lock{font-size:12px;opacity:.5;margin-left:4px}

.online-badge{
  display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;
  background:rgba(0,206,201,.08);border:1px solid rgba(0,206,201,.2);
  cursor:pointer;user-select:none;position:relative;transition:background .2s;
}
.online-badge:hover{background:rgba(0,206,201,.15)}
.online-badge .cnt{font-size:12px;font-weight:700;color:var(--green)}
.online-badge .arrow{font-size:10px;color:var(--green);transition:transform .2s}
.online-badge .arrow.open{transform:rotate(180deg)}
.online-dropdown{
  position:absolute;top:calc(100% + 8px);left:0;min-width:140px;max-width:220px;
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);padding:8px 0;z-index:100;display:none;
  animation:ddIn .2s ease;
}
.online-dropdown.show{display:block}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.online-dropdown .dd-title{font-size:10px;color:var(--t3);padding:4px 14px 6px;text-transform:uppercase;letter-spacing:1px}
.online-dropdown .dd-item{
  display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12px;color:var(--t1);
}
.online-dropdown .dd-item .dd-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.online-dropdown .dd-item.self{color:var(--accent2);font-weight:600}

.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:5px}
.msgs::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

.m{display:flex;gap:10px;padding:5px 0;animation:mi .3s ease}
@keyframes mi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.m .av{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin-top:2px}
.m .bd{flex:1;min-width:0}
.m .hd{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.m .au{font-size:13px;font-weight:700}
.m .tm{font-size:10px;color:var(--t3)}
.m .tx{font-size:13.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.m.sys{text-align:center;padding:6px 0;font-size:11px;color:var(--t3)}
.m.sys span{background:var(--bg2);padding:3px 12px;border-radius:16px}
.m.sys.join span{color:var(--green);border:1px solid rgba(0,206,201,.2)}
.m.sys.leave span{color:var(--red);border:1px solid rgba(255,118,117,.2)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--t3)}
.empty .ic{font-size:44px;opacity:.4}

.inp{padding:14px 18px 18px;background:var(--bg1);border-top:1px solid var(--border);flex-shrink:0}
.inp .row{display:flex;gap:9px;align-items:flex-end}
.inp textarea{
  flex:1;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--bg3);color:var(--t1);font-size:13.5px;font-family:inherit;
  resize:none;outline:none;max-height:110px;min-height:42px;line-height:1.5;
  transition:border .2s,box-shadow .2s;
}
.inp textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.inp textarea::placeholder{color:var(--t3)}
.btn-s{
  width:42px;height:42px;border-radius:10px;border:none;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),#8b7cf7);
  color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px var(--glow);transition:transform .15s;
}
.btn-s:hover{transform:scale(1.06)}
.btn-s:disabled{opacity:.4;cursor:not-allowed;transform:none}
.inp .hint{font-size:10px;color:var(--t3);margin-top:7px;padding-left:3px}

.toasts{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:7px}
.toast{
  padding:10px 18px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);
  font-size:12px;box-shadow:var(--shadow);animation:ti .3s ease;
}
.toast.err{border-color:rgba(255,118,117,.3);color:var(--red)}
.toast.ok{border-color:rgba(0,206,201,.3);color:var(--green)}
@keyframes ti{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

@media(max-width:480px){.card{padding:28px 20px 24px}.bar{padding:8px 12px}.msgs{padding:12px}.inp{padding:10px 12px 14px}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="toasts" id="toasts"></div>

<!-- LOBBY -->
<div class="screen on" id="lobby">
<div class="card">
  <div class="logo">💬</div>
  <h1>NexusChat</h1>
  <p class="sub">轻量 IRC 聊天 · 基于 TextDB 去中心化存储</p>
  <div class="fg"><label>昵称</label><input id="iNick" maxlength="16" placeholder="你的昵称" autocomplete="off"></div>
  <div class="fg"><label>房间号</label><input id="iRoom" maxlength="28" placeholder="输入房间号（新号即创建）" autocomplete="off"></div>
  <div class="fg">
    <label>房间密码 <span style="font-weight:400;text-transform:none;opacity:.6">(可选)</span></label>
    <div class="pass-wrap">
      <input id="iPass" type="password" maxlength="32" placeholder="新房间设置密码 / 已有房间输入密码" autocomplete="off">
      <span class="lock-ico">🔒</span>
    </div>
    <div class="hint-small">创建新房间时填写则设置密码；加入已有密码房间时需填写正确密码</div>
  </div>
  <button class="btn-go" id="btnGo" onclick="join()">进入房间 →</button>
  <button class="btn-hall" id="btnHall" onclick="joinHall()"> 进入大厅 →</button>
  <div class="note">消息存储在 TextDB 公开服务，请勿发送敏感内容<br>每 IP 每日限 500 次写入</div>
</div>
</div>

<!-- CHAT -->
<div class="screen" id="chat">
  <div class="bar">
    <div class="ico" id="cIco">#</div>
    <div class="info">
      <div class="name" id="cName">#</div>
      <div class="meta" id="cMeta">连接中…</div>
    </div>
    <div class="online-badge" id="onlineBadge" onclick="toggleOnlineList()">
      <span class="cnt" id="onlineCnt">0</span>
      <span class="arrow" id="onlineArrow">▼</span>
      <div class="online-dropdown" id="onlineDropdown">
        <div class="dd-title">在线成员</div>
        <div id="onlineList"></div>
      </div>
    </div>
    <div class="dot"></div>
    <button class="btn-out" onclick="leaveConfirm()">退出</button>
  </div>
  <div class="msgs" id="msgs"><div class="empty"><div class="ic">🌌</div><p>暂无消息</p></div></div>
  <div class="inp">
    <div class="row">
      <textarea id="iMsg" rows="1" placeholder="输入消息… Enter 发送" onkeydown="hk(event)"></textarea>
      <button class="btn-s" id="btnS" onclick="send()">➤</button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · 最多保留 50 条</div>
  </div>
</div>

<script>
// ===== 禁止右键 =====
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === 'F12') e.preventDefault();
  if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) e.preventDefault();
  if (e.ctrlKey && e.key === 'u') e.preventDefault();
});

// ===== CONFIG =====
const BASE = 'https://textdb.online';
const PREFIX = 'nxc9k';
const MAX_MSG = 50;
const POLL_MS = 3000;
const HEARTBEAT_MS = 5000;
const PRESENCE_TIMEOUT = 15000;
const HALL_ROOM_ID = '123';

// ===== STATE =====
let nick='', room='', idxKey='', presenceKey='', passKey='', color='', timer=null, hbTimer=null, lastSig='', busy=false;
let cache = {};
let onlineUsers = {};
let prevOnlineSet = new Set();
let isInRoom = false;
let roomHasPass = false;
let isHall = false;

// ===== UTILS =====
const $=id=>document.getElementById(id);
function toast(s,t=''){const e=document.createElement('div');e.className='toast '+t;e.textContent=s;$('toasts').appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .3s'},2600);setTimeout(()=>e.remove(),3000)}
function rnd(n=24){const c='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';const a=new Uint8Array(n);crypto.getRandomValues(a);let s='';for(let i=0;i<n;i++)s+=c[a[i]%c.length];return s}
function hc(s){let h=0;for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);const C=['#6c5ce7','#00cec9','#fd79a8','#fdcb6e','#e17055','#0984e3','#00b894','#e84393','#a29bfe','#55efc4','#fab1a0','#74b9ff','#ff7675'];return C[Math.abs(h)%C.length]}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function ft(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

// 安全解码：兼容旧消息（未编码的）
function safeDecode(str) {
  try { return decodeURIComponent(str); } catch { return str; }
}

function hashPass(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
}

function writeKV(key, value) {
  return new Promise(resolve => {
    const url = BASE + '/update/?key=' + encodeURIComponent(key) + '&value=' + encodeURIComponent(value);
    const img = new Image();
    let done = false;
    const fin = () => { if(!done){done=true;resolve(true)} };
    img.onload = fin;
    img.onerror = fin;
    img.src = url;
    setTimeout(fin, 4000);
  });
}

const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
];
let pIdx = 0;

async function readKey(key) {
  const target = BASE + '/' + encodeURIComponent(key);
  try {
    const r = await fetch(target, {signal: AbortSignal.timeout(4000)});
    if (r.ok) { const t = await r.text(); return parseVal(t); }
  } catch(_){}
  for (let i = 0; i < PROXIES.length; i++) {
    const idx = (pIdx + i) % PROXIES.length;
    try {
      const r = await fetch(PROXIES[idx](target), {signal: AbortSignal.timeout(7000)});
      if (!r.ok) continue;
      const t = await r.text();
      pIdx = idx;
      if (idx === 3) {
        try { const j = JSON.parse(t); return parseVal(j.contents); } catch(_){ continue; }
      }
      return parseVal(t);
    } catch(_){}
  }
  throw new Error('读取失败');
}

function parseVal(text) {
  if (!text || text === 'Not Found' || text === 'null') return null;
  try { return JSON.parse(text); } catch { return text; }
}

// ===== 在线状态管理 =====
async function updatePresence() {
  try {
    let data = {};
    try {
      const cur = await readKey(presenceKey);
      if (cur && typeof cur === 'object' && !Array.isArray(cur)) data = cur;
    } catch(_){}
    data[nick] = Date.now();
    const now = Date.now();
    for (const k in data) {
      if (now - data[k] > PRESENCE_TIMEOUT) delete data[k];
    }
    await writeKV(presenceKey, JSON.stringify(data));
    processPresence(data);
  } catch(_){}
}

async function readPresence() {
  try {
    const cur = await readKey(presenceKey);
    if (cur && typeof cur === 'object' && !Array.isArray(cur)) {
      const now = Date.now();
      const valid = {};
      for (const k in cur) {
        if (now - cur[k] <= PRESENCE_TIMEOUT) valid[k] = cur[k];
      }
      processPresence(valid);
    }
  } catch(_){}
}

function processPresence(data) {
  const newSet = new Set(Object.keys(data));
  if (!isHall) {
    for (const name of newSet) {
      if (!prevOnlineSet.has(name) && name !== nick) {
        appendSysMsg(name + ' 加入了房间', 'join');
      }
    }
    for (const name of prevOnlineSet) {
      if (!newSet.has(name) && name !== nick) {
        appendSysMsg(name + ' 离开了房间', 'leave');
      }
    }
  }
  prevOnlineSet = newSet;
  onlineUsers = data;
  updateOnlineUI();
}

function updateOnlineUI() {
  const cnt = Object.keys(onlineUsers).length;
  $('onlineCnt').textContent = cnt;
  let html = '';
  const names = Object.keys(onlineUsers).sort();
  for (const name of names) {
    const isSelf = name === nick;
    html += `<div class="dd-item${isSelf ? ' self' : ''}"><span class="dd-dot"></span>${esc(name)}${isSelf ? ' (我)' : ''}</div>`;
  }
  $('onlineList').innerHTML = html || '<div class="dd-item" style="color:var(--t3)">暂无在线用户</div>';
}

function toggleOnlineList() {
  const dd = $('onlineDropdown');
  const arrow = $('onlineArrow');
  dd.classList.toggle('show');
  arrow.classList.toggle('open');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.online-badge')) {
    $('onlineDropdown').classList.remove('show');
    $('onlineArrow').classList.remove('open');
  }
});

function appendSysMsg(text, type) {
  const w = $('msgs');
  const empty = w.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'm sys ' + type;
  div.innerHTML = `<span>${esc(text)}</span>`;
  w.appendChild(div);
  w.scrollTop = w.scrollHeight;
}

// ===== 离开房间处理 =====
async function removeFromPresence(wasHall) {
  try {
    let data = {};
    try {
      const cur = await readKey(presenceKey);
      if (cur && typeof cur === 'object' && !Array.isArray(cur)) data = cur;
    } catch(_){}

    delete data[nick];

    const now = Date.now();
    for (const k in data) {
      if (now - data[k] > PRESENCE_TIMEOUT) delete data[k];
    }

    if (!wasHall && Object.keys(data).length === 0) {
      await writeKV(idxKey, JSON.stringify([]));
      await writeKV(presenceKey, JSON.stringify({}));
    } else {
      await writeKV(presenceKey, JSON.stringify(data));
    }
  } catch(_){}
}

function getOnlineCount() {
  return Object.keys(onlineUsers).length;
}

// ===== beforeunload =====
window.addEventListener('beforeunload', function(e) {
  if (!isInRoom) return;
  if (isHall) return;

  const cnt = getOnlineCount();
  if (cnt > 1) {
    e.preventDefault();
    e.returnValue = '你将会离开房间！';
    return e.returnValue;
  } else {
    e.preventDefault();
    e.returnValue = '房间将关闭并清除数据！';
    return e.returnValue;
  }
});

window.addEventListener('pagehide', () => {
  if (isInRoom) {
    removeFromPresence(isHall);
  }
});

// ===== LOBBY =====
async function join() {
  const n = $('iNick').value.trim();
  const r = $('iRoom').value.trim();
  const p = $('iPass').value.trim();

  if (!n) { toast('请输入昵称','err'); return; }
  if (!r) { toast('请输入房间号','err'); return; }

  if (r === HALL_ROOM_ID) {
    toast('无效的房间号','err');
    return;
  }

  nick = n;
  room = r;
  isHall = false;
  idxKey = PREFIX + r.replace(/[^0-9a-zA-Z\-_]/g,'x').slice(0,30);
  presenceKey = idxKey + '_presence';
  passKey = idxKey + '_pass';
  color = hc(nick);

  $('btnGo').disabled = true;
  $('btnGo').textContent = '进入中…';

  try {
    let presenceData = null;
    try { presenceData = await readKey(presenceKey); } catch(_){}

    if (presenceData && typeof presenceData === 'object' && !Array.isArray(presenceData)) {
      const now = Date.now();
      for (const k in presenceData) {
        if (now - presenceData[k] > PRESENCE_TIMEOUT) delete presenceData[k];
      }
      if (presenceData[nick]) {
        toast('昵称 "' + nick + '" 已被占用，请换一个','err');
        $('btnGo').disabled = false;
        $('btnGo').textContent = '进入房间 →';
        return;
      }
    }

    let storedHash = null;
    try { storedHash = await readKey(passKey); } catch(_){}

    if (storedHash && typeof storedHash === 'string' && storedHash.length > 0) {
      roomHasPass = true;
      if (!p) {
        toast('该房间已设置密码，请输入密码','err');
        $('btnGo').disabled = false;
        $('btnGo').textContent = '进入房间 →';
        $('iPass').focus();
        return;
      }
      if (hashPass(p) !== storedHash) {
        toast('密码错误，无法加入房间','err');
        $('btnGo').disabled = false;
        $('btnGo').textContent = '进入房间 →';
        return;
      }
    } else {
      roomHasPass = false;
      if (p) {
        const hashed = hashPass(p);
        await writeKV(passKey, hashed);
        roomHasPass = true;
        toast('房间密码已设置','ok');
      }
    }

    isInRoom = true;
    prevOnlineSet = new Set();
    enterChat();

  } catch(e) {
    toast('连接失败: ' + e.message, 'err');
    $('btnGo').disabled = false;
    $('btnGo').textContent = '进入房间 →';
  }
}

// ===== 进入大厅 =====
async function joinHall() {
  const n = $('iNick').value.trim();
  if (!n) { toast('请输入昵称','err'); return; }

  nick = n;
  room = HALL_ROOM_ID;
  isHall = true;
  roomHasPass = false;
  idxKey = PREFIX + HALL_ROOM_ID;
  presenceKey = idxKey + '_presence';
  passKey = idxKey + '_pass';
  color = hc(nick);

  $('btnHall').disabled = true;
  $('btnHall').textContent = '进入中…';

  try {
    let presenceData = null;
    try { presenceData = await readKey(presenceKey); } catch(_){}

    if (presenceData && typeof presenceData === 'object' && !Array.isArray(presenceData)) {
      const now = Date.now();
      for (const k in presenceData) {
        if (now - presenceData[k] > PRESENCE_TIMEOUT) delete presenceData[k];
      }
      if (presenceData[nick]) {
        toast('昵称 "' + nick + '" 已被占用，请换一个','err');
        $('btnHall').disabled = false;
        $('btnHall').textContent = ' 进入大厅 →';
        return;
      }
    }

    isInRoom = true;
    prevOnlineSet = new Set();
    enterChat();

  } catch(e) {
    toast('连接失败: ' + e.message, 'err');
    $('btnHall').disabled = false;
    $('btnHall').textContent = ' 进入大厅 →';
  }
}

function enterChat() {
  $('lobby').classList.remove('on');
  $('chat').classList.add('on');

  if (isHall) {
    $('cName').textContent = '大厅';
    $('cIco').textContent = '🏠';
  } else {
    const lockIcon = roomHasPass ? ' 🔒' : '';
    $('cName').textContent = '# ' + room + lockIcon;
    $('cIco').textContent = room[0].toUpperCase();
  }

  $('cMeta').textContent = '加载中…';
  lastSig = ''; cache = {};

  updatePresence();

  if (!isHall) {
    appendSysMsg(nick + ' 加入了房间', 'join');
  }

  poll();
  timer = setInterval(poll, POLL_MS);
  hbTimer = setInterval(updatePresence, HEARTBEAT_MS);
}

function leaveConfirm() {
  if (isHall) {
    doLeave();
    return;
  }

  const cnt = getOnlineCount();
  let msg;
  if (cnt > 1) {
    msg = '你将会离开房间！确定退出吗？';
  } else {
    msg = '房间将关闭并清除数据！确定退出吗？';
  }
  if (confirm(msg)) {
    doLeave();
  }
}

async function doLeave() {
  const wasHall = isHall;
  isInRoom = false;
  clearInterval(timer); timer = null;
  clearInterval(hbTimer); hbTimer = null;
  await removeFromPresence(wasHall);
  $('chat').classList.remove('on');
  $('lobby').classList.add('on');
  $('btnGo').disabled = false;
  $('btnGo').textContent = '进入房间 →';
  $('btnHall').disabled = false;
  $('btnHall').textContent = ' 进入大厅 →';
  $('msgs').innerHTML = '<div class="empty"><div class="ic">🌌</div><p>暂无消息</p></div>';
  $('onlineCnt').textContent = '0';
  $('onlineList').innerHTML = '';
  onlineUsers = {};
  prevOnlineSet = new Set();
  roomHasPass = false;
  isHall = false;
}

// ===== POLL =====
async function poll() {
  try {
    const index = await readKey(idxKey);
    const ids = Array.isArray(index) ? index : [];
    const sig = ids.length + ':' + (ids[ids.length-1]||'');
    if (sig !== lastSig) {
      lastSig = sig;
      const recent = ids.slice(-MAX_MSG);
      const missing = recent.filter(id => !cache[id]);
      for (let i = 0; i < missing.length; i += 5) {
        const batch = missing.slice(i, i+5);
        const results = await Promise.allSettled(batch.map(id => readKey(id)));
        results.forEach((r, j) => {
          if (r.status === 'fulfilled' && r.value) cache[batch[j]] = r.value;
        });
      }
      const msgs = [];
      for (const id of recent) {
        if (cache[id]) msgs.push(cache[id]);
      }
      render(msgs);
      $('cMeta').textContent = msgs.length + ' 条消息 · 轮询中';
    }
    readPresence();
  } catch(e) {
    $('cMeta').textContent = '连接中… 重试';
  }
}

// ===== RENDER =====
function render(msgs) {
  const w = $('msgs');
  const atBot = w.scrollHeight - w.scrollTop - w.clientHeight < 50;

  if (!msgs.length) {
    w.innerHTML = '<div class="empty"><div class="ic">🌌</div><p>暂无消息，说点什么吧</p></div>';
    return;
  }

  let h = '', la = null, lt = 0;
  for (const m of msgs) {
    if (m.sys) {
      h += `<div class="m sys"><span>${esc(m.sys)}</span></div>`;
      la = null; continue;
    }
    const c = m.c || hc(m.u||'?');
    const decodedText = safeDecode(m.x||'');
    const grp = (m.u === la) && (m.t - lt < 90000);
    if (!grp) {
      h += `<div class="m"><div class="av" style="background:${c}">${esc((m.u||'?')[0].toUpperCase())}</div><div class="bd"><div class="hd"><span class="au" style="color:${c}">${esc(m.u||'')}</span><span class="tm">${ft(m.t||0)}</span></div><div class="tx">${esc(decodedText)}</div></div></div>`;
    } else {
      h += `<div class="m" style="padding-left:46px"><div class="bd"><div class="tx">${esc(decodedText)}</div></div></div>`;
    }
    la = m.u; lt = m.t;
  }
  w.innerHTML = h;
  if (atBot) w.scrollTop = w.scrollHeight;
}

// ===== SEND =====
function hk(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } }

async function send() {
  const txt = $('iMsg').value.trim();
  if (!txt || busy) return;
  if (txt.length > 400) { toast('消息最长 400 字符','err'); return; }

  busy = true;
  $('btnS').disabled = true;

  try {
    const msgId = rnd(24);
    const encodedTxt = encodeURIComponent(txt);
    const body = JSON.stringify({ u:nick, x:encodedTxt, t:Date.now(), c:color });
    await writeKV(msgId, body);

    let ids = [];
    try {
      const cur = await readKey(idxKey);
      if (Array.isArray(cur)) ids = cur;
    } catch(_){}

    ids.push(msgId);
    if (ids.length > MAX_MSG) ids = ids.slice(ids.length - MAX_MSG);
    await writeKV(idxKey, JSON.stringify(ids));

    cache[msgId] = { u:nick, x:encodedTxt, t:Date.now(), c:color };
    $('iMsg').value = '';
    $('iMsg').style.height = 'auto';
    lastSig = '';
    poll();
    toast('已发送','ok');
  } catch(e) {
    toast('发送失败: ' + e.message, 'err');
  }

  busy = false;
  $('btnS').disabled = false;
  $('iMsg').focus();
}

// ===== TEXTAREA RESIZE =====
$('iMsg').addEventListener('input', function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,110)+'px';
});
$('iNick').addEventListener('keydown',e=>{if(e.key==='Enter')$('iRoom').focus()});
$('iRoom').addEventListener('keydown',e=>{if(e.key==='Enter')$('iPass').focus()});
$('iPass').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
</script>

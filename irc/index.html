<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusChat · IRC</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg0:#0a0a14;--bg1:#12121f;--bg2:#1a1a2e;--bg3:#222240;
  --accent:#6c5ce7;--accent2:#a29bfe;--glow:rgba(108,92,231,.3);
  --green:#00cec9;--pink:#fd79a8;--red:#ff7675;--orange:#fdcb6e;
  --t1:#eeeef5;--t2:#9d9db5;--t3:#55556e;
  --border:rgba(255,255,255,.06);
  --r:14px;--shadow:0 8px 32px rgba(0,0,0,.4);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
  background:var(--bg0);color:var(--t1);height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(120px);opacity:.14;animation:fl 20s ease-in-out infinite alternate}
.bg i:nth-child(1){width:520px;height:520px;background:var(--accent);top:-12%;left:-6%}
.bg i:nth-child(2){width:420px;height:420px;background:var(--green);bottom:-10%;right:-6%;animation-delay:-7s}
.bg i:nth-child(3){width:300px;height:300px;background:var(--pink);top:45%;left:55%;animation-delay:-13s}
@keyframes fl{0%{transform:translate(0,0) scale(1)}50%{transform:translate(35px,-25px) scale(1.08)}100%{transform:translate(-20px,30px) scale(.94)}}

.screen{display:none;width:100%;height:100%;position:relative;z-index:1}
.screen.on{display:flex}

#lobby{align-items:center;justify-content:center}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:22px;
  padding:28px 38px 24px;width:410px;max-width:92vw;text-align:center;
  box-shadow:var(--shadow),0 0 60px var(--glow);
  animation:up .5s cubic-bezier(.22,1,.36,1);
}
@keyframes up{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.card .logo{width:48px;height:48px;margin:0 auto 12px;background:linear-gradient(135deg,var(--accent),var(--green));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px}
.card h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--t1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card .sub{font-size:12px;color:var(--t3);margin:4px 0 18px}
.fg{text-align:left;margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:7px;text-transform:uppercase;letter-spacing:1px}
.fg input{
  width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--bg3);color:var(--t1);font-size:14px;outline:none;
  transition:border .2s,box-shadow .2s;
}
.fg input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.fg input:-webkit-autofill,
.fg input:-webkit-autofill:hover,
.fg input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 1000px var(--bg3) inset;
  -webkit-text-fill-color:var(--t1);
  box-shadow:none;
  border-color:var(--border);
}
.fg input::placeholder{color:var(--t3)}
.fg .hint-small{font-size:10px;color:var(--t3);margin-top:5px}
.btn-go{
  width:100%;padding:13px;border:none;border-radius:10px;margin-top:6px;
  background:linear-gradient(135deg,var(--accent),#8b7cf7);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px var(--glow);transition:transform .15s,box-shadow .15s;
}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 6px 22px var(--glow)}
.btn-go:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-hall{
  width:100%;padding:13px;border:none;border-radius:10px;margin-top:10px;
  background:linear-gradient(135deg,var(--green),#00b894);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,206,201,.3);transition:transform .15s,box-shadow .15s;
}
.btn-hall:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,206,201,.3)}
.btn-hall:disabled{opacity:.5;cursor:not-allowed;transform:none}
.card .note{margin-top:20px;font-size:11px;color:var(--t3);line-height:1.7}
.fg .pass-wrap{position:relative}
.fg .pass-wrap input{padding-right:40px}
.fg .pass-wrap .lock-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.4}

.dev-badge{
  background:linear-gradient(90deg,#f9ca24,#f0932b,#eb4d4b,#6c5ce7,#00cec9);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  font-weight:900;
  animation:devShine 3s linear infinite;
}
@keyframes devShine{0%{background-position:0% center}100%{background-position:200% center}}

.owner-badge{
  color:var(--orange);font-weight:800;font-size:12px;
}

.ctx-menu{
  position:fixed;z-index:9999;background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow);padding:6px 0;min-width:160px;
  animation:ctxIn .15s ease;
}
@keyframes ctxIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.ctx-menu .ctx-item{
  padding:9px 16px;font-size:12px;color:var(--t1);cursor:pointer;display:flex;align-items:center;gap:8px;
}
.ctx-menu .ctx-item:hover{background:var(--bg3)}
.ctx-menu .ctx-item.danger{color:var(--red)}
.ctx-menu .ctx-item.danger:hover{background:rgba(255,118,117,.1)}
.ctx-menu .ctx-item.warn{color:var(--orange)}
.ctx-menu .ctx-item.warn:hover{background:rgba(253,203,110,.1)}
.ctx-menu .ctx-sep{height:1px;background:var(--border);margin:4px 0}

/* 管理员操作弹窗 */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:16px;
  padding:28px 24px;width:340px;max-width:90vw;box-shadow:var(--shadow);
}
.modal-box h3{font-size:16px;margin-bottom:16px;color:var(--t1)}
.modal-box .m-fg{margin-bottom:14px}
.modal-box .m-fg label{display:block;font-size:11px;color:var(--t2);margin-bottom:6px;font-weight:600}
.modal-box .m-fg input{
  width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--bg3);color:var(--t1);font-size:13px;outline:none;
}
.modal-box .m-fg input:focus{border-color:var(--accent)}
.modal-box .m-btns{display:flex;gap:10px;margin-top:18px}
.modal-box .m-btns button{
  flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
}
.modal-box .m-btns .m-cancel{background:var(--bg3);color:var(--t2)}
.modal-box .m-btns .m-confirm{background:var(--accent);color:#fff}
.modal-box .m-btns .m-danger{background:var(--red);color:#fff}

/* 临时系统提示 */
.temp-sys{
  text-align:center;padding:6px 0;font-size:11px;color:var(--t3);
  transition:opacity .5s ease;
}
.temp-sys span{background:var(--bg2);padding:3px 12px;border-radius:16px;border:1px solid rgba(0,206,201,.2);color:var(--green)}
.temp-sys.fade-out{opacity:0}

/* 警告横幅 */
.warn-banner{
  position:fixed;top:0;left:0;right:0;z-index:9998;
  background:linear-gradient(90deg,rgba(253,203,110,.15),rgba(255,118,117,.15));
  border-bottom:1px solid rgba(253,203,110,.3);
  padding:12px 20px;text-align:center;font-size:13px;color:var(--orange);
  animation:slideDown .3s ease;
}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}

#chat{flex-direction:column;height:100vh}
.bar{
  display:flex;align-items:center;gap:10px;padding:10px 18px;
  background:var(--bg1);border-bottom:1px solid var(--border);flex-shrink:0;
  position:relative;
}
.bar .ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--green));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff}
.bar .info{flex:1;min-width:0}
.bar .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .meta{font-size:10px;color:var(--t3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}
.btn-out{
  padding:7px 14px;border-radius:8px;border:1px solid rgba(255,118,117,.25);
  background:rgba(255,118,117,.08);color:var(--red);font-size:12px;font-weight:600;cursor:pointer;
}
.btn-out:hover{background:rgba(255,118,117,.18)}
.online-badge{
  display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;
  background:rgba(0,206,201,.08);border:1px solid rgba(0,206,201,.2);
  cursor:pointer;user-select:none;position:relative;transition:background .2s;
}
.online-badge:hover{background:rgba(0,206,201,.15)}
.online-badge .cnt{font-size:12px;font-weight:700;color:var(--green)}
.online-badge .arrow{font-size:10px;color:var(--green);transition:transform .2s}
.online-badge .arrow.open{transform:rotate(180deg)}
.online-dropdown{
  position:absolute;top:calc(100% + 8px);left:0;min-width:140px;max-width:220px;
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);padding:8px 0;z-index:100;display:none;
  animation:ddIn .2s ease;
}
.online-dropdown.show{display:block}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.online-dropdown .dd-title{font-size:10px;color:var(--t3);padding:4px 14px 6px;text-transform:uppercase;letter-spacing:1px}
.online-dropdown .dd-item{
  display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12px;color:var(--t1);
}
.online-dropdown .dd-item .dd-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.online-dropdown .dd-item.self{color:var(--accent2);font-weight:600}

.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:5px}
.msgs::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

.m{display:flex;gap:10px;padding:5px 0;animation:mi .3s ease}
@keyframes mi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.m .av{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin-top:2px;cursor:default}
.m .bd{flex:1;min-width:0}
.m .hd{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.m .au{font-size:13px;font-weight:700}
.m .tm{font-size:10px;color:var(--t3)}
.m .tx{font-size:13.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.m.sys{text-align:center;padding:6px 0;font-size:11px;color:var(--t3)}
.m.sys span{background:var(--bg2);padding:3px 12px;border-radius:16px}
.m.sys.join span{color:var(--green);border:1px solid rgba(0,206,201,.2)}
.m.sys.leave span{color:var(--red);border:1px solid rgba(255,118,117,.2)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--t3)}
.empty .ic{font-size:44px;opacity:.4}

.inp{padding:14px 18px 18px;background:var(--bg1);border-top:1px solid var(--border);flex-shrink:0}
.inp .row{display:flex;gap:9px;align-items:flex-end}
.inp textarea{
  flex:1;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--bg3);color:var(--t1);font-size:13.5px;font-family:inherit;
  resize:none;outline:none;max-height:110px;min-height:42px;line-height:1.5;
  transition:border .2s,box-shadow .2s;
}
.inp textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.inp textarea::placeholder{color:var(--t3)}
.inp textarea.muted{opacity:.5;cursor:not-allowed;background:rgba(255,118,117,.05);border-color:rgba(255,118,117,.3)}
.btn-s{
  width:42px;height:42px;border-radius:10px;border:none;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),#8b7cf7);
  color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px var(--glow);transition:transform .15s;
}
.btn-s:hover{transform:scale(1.06)}
.btn-s:disabled{opacity:.4;cursor:not-allowed;transform:none}
.inp .hint{font-size:10px;color:var(--t3);margin-top:7px;padding-left:3px}

.toasts{position:fixed;top:16px;right:16px;z-index:99999;display:flex;flex-direction:column;gap:7px}
.toast{
  padding:10px 18px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);
  font-size:12px;box-shadow:var(--shadow);animation:ti .3s ease;
}
.toast.err{border-color:rgba(255,118,117,.3);color:var(--red)}
.toast.ok{border-color:rgba(0,206,201,.3);color:var(--green)}
@keyframes ti{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

@media(max-width:480px){.card{padding:28px 20px 24px}.bar{padding:8px 12px}.msgs{padding:12px}.inp{padding:10px 12px 14px}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="toasts" id="toasts"></div>

<!-- LOBBY -->
<div class="screen on" id="lobby">
<div class="card">
  <div class="logo">💬</div>
  <h1>NexusChat</h1>
  <p class="sub">轻量 IRC 聊天 · 基于 TextDB 去中心化存储</p>
  <div class="fg"><label>昵称</label><input id="iNick" maxlength="16" placeholder="你的昵称" autocomplete="off"></div>
  <div class="fg"><label>房间号</label><input id="iRoom" maxlength="28" placeholder="输入房间号（新号即创建）" autocomplete="off"></div>
  <div class="fg">
    <label>房间密码 <span style="font-weight:400;text-transform:none;opacity:.6">(可选)</span></label>
    <div class="pass-wrap">
      <input id="iPass" type="password" maxlength="32" placeholder="新房间设置密码 / 已有房间输入密码" autocomplete="off">
      <span class="lock-ico">🔒</span>
    </div>
    <div class="hint-small">创建新房间时填写则设置密码；加入已有密码房间时需填写正确密码</div>
  </div>
  <div class="fg">
    <label>管理员密码 <span style="font-weight:400;text-transform:none;opacity:.6">(可选)</span></label>
    <div class="pass-wrap">
      <input id="iAdmin" type="password" maxlength="32" placeholder="管理员专用" autocomplete="off">
      <span class="lock-ico">🛡️</span>
    </div>
  </div>
  <button class="btn-go" id="btnGo" onclick="join()">进入房间 →</button>
  <button class="btn-hall" id="btnHall" onclick="joinHall()"> 进入大厅 →</button>
  <div class="note">消息存储在 TextDB 公开服务，请勿发送敏感内容<br>每 IP 每日限 500 次写入</div>
</div>
</div>

<!-- CHAT -->
<div class="screen" id="chat">
  <div class="bar">
    <div class="ico" id="cIco">#</div>
    <div class="info">
      <div class="name" id="cName">#</div>
      <div class="meta" id="cMeta">连接中…</div>
    </div>
    <div class="online-badge" id="onlineBadge" onclick="toggleOnlineList()">
      <span class="cnt" id="onlineCnt">0</span>
      <span class="arrow" id="onlineArrow">▼</span>
      <div class="online-dropdown" id="onlineDropdown">
        <div class="dd-title">在线成员</div>
        <div id="onlineList"></div>
      </div>
    </div>
    <div class="dot"></div>
    <button class="btn-out" onclick="leaveConfirm()">退出</button>
  </div>
  <div class="msgs" id="msgs"><div class="empty"><div class="ic">🌌</div><p>暂无消息</p></div></div>
  <div class="inp">
    <div class="row">
      <textarea id="iMsg" rows="1" placeholder="输入消息… Enter 发送" onkeydown="hk(event)"></textarea>
      <button class="btn-s" id="btnS" onclick="send()">➤</button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · 最多保留 50 条</div>
  </div>
</div>

<script>
// ===== [1] 彻底禁止右键菜单的"查看源代码"和"调试" =====
document.addEventListener('contextmenu', e => {
  // 只有在消息区域且是管理员时才允许自定义右键菜单
  if (!e.target.closest('.m[data-user]')) {
    e.preventDefault();
    return;
  }
  if (!isAdmin && !e.target.closest('.m[data-user]')) {
    e.preventDefault();
  }
  // 非管理员完全禁止右键
  if (!isAdmin) {
    // 允许自己消息的右键（用于撤回）
    const msgEl = e.target.closest('.m[data-user]');
    if (msgEl && msgEl.getAttribute('data-user') === nick) {
      // 允许，由自定义菜单处理
    } else {
      e.preventDefault();
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); return false; }
  if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); return false; }
  if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); e.stopPropagation(); return false; }
  if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return false; }
});

// ===== CONFIG =====
const BASE = 'https://textdb.online';
const PREFIX = 'nxc9k';
const MAX_MSG = 50;
const POLL_MS = 3000;
const HEARTBEAT_MS = 5000;
const PRESENCE_TIMEOUT = 15000;
const HALL_ROOM_ID = '123';
const ADMIN_PASS = '141220177';
const RECALL_LIMIT = 60000; // 1分钟撤回
const KICK_DURATION = 60000; // 踢出1分钟
const REFRESH_INTERVAL = 300000; // 5分钟刷新防TTL

// ===== STATE =====
let nick='', room='', idxKey='', presenceKey='', passKey='', color='', timer=null, hbTimer=null, lastSig='', busy=false;
let cache = {};
let msgIdMap = [];
let onlineUsers = {};
let prevOnlineSet = new Set();
let isInRoom = false;
let roomHasPass = false;
let isHall = false;
let joinMsgPending = false;
let isAdmin = false;
let isOwner = false;
let roomOwner = '';
let muteUntil = 0;
let refreshTimer = null;
let muteCheckTimer = null;

// ===== 右键菜单 =====
let ctxMenu = null;

function showCtxMenu(x, y, items) {
  hideCtxMenu();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  items.forEach(item => {
    if (item.sep) {
      const sep = document.createElement('div');
      sep.className = 'ctx-sep';
      menu.appendChild(sep);
      return;
    }
    const div = document.createElement('div');
    div.className = 'ctx-item ' + (item.cls || '');
    div.innerHTML = item.icon + ' ' + item.text;
    div.addEventListener('click', (e) => { e.stopPropagation(); hideCtxMenu(); item.action(); });
    menu.appendChild(div);
  });
  document.body.appendChild(menu);
  const rect = menu.getBoundingClientRect();
  if (x + rect.width > window.innerWidth) x = window.innerWidth - rect.width - 8;
  if (y + rect.height > window.innerHeight) y = window.innerHeight - rect.height - 8;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  ctxMenu = menu;
}

function hideCtxMenu() {
  if (ctxMenu) { ctxMenu.remove(); ctxMenu = null; }
}

document.addEventListener('click', () => hideCtxMenu());
document.addEventListener('scroll', () => hideCtxMenu(), true);

// ===== UTILS =====
const $=id=>document.getElementById(id);
function toast(s,t=''){const e=document.createElement('div');e.className='toast '+t;e.textContent=s;$('toasts').appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .3s'},2600);setTimeout(()=>e.remove(),3000)}
function rnd(n=24){const c='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';const a=new Uint8Array(n);crypto.getRandomValues(a);let s='';for(let i=0;i<n;i++)s+=c[a[i]%c.length];return s}
function hc(s){let h=0;for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);const C=['#6c5ce7','#00cec9','#fd79a8','#fdcb6e','#e17055','#0984e3','#00b894','#e84393','#a29bfe','#55efc4','#fab1a0','#74b9ff','#ff7675'];return C[Math.abs(h)%C.length]}
function esc(s){const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function ft(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

function hasInvalidNickChars(str) {
  const re = /[\u{E0000}-\u{E007F}\u200B\u200C\u200D\u200E\u200F\uFEFF\u00AD\u2060\u2061\u2062\u2063\u2064\u2066\u2067\u2068\u2069]/u;
  return re.test(str);
}

function safeDecode(str) {
  if (typeof str !== 'string') return String(str || '');
  try { return decodeURIComponent(str); } catch { return str; }
}

function hashPass(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
}

function writeKV(key, value) {
  return new Promise(resolve => {
    const url = BASE + '/update/?key=' + encodeURIComponent(key) + '&value=' + encodeURIComponent(value);
    const img = new Image();
    let done = false;
    const fin = () => { if(!done){done=true;resolve(true)} };
    img.onload = fin;
    img.onerror = fin;
    img.src = url;
    setTimeout(fin, 4000);
  });
}

const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
];
let pIdx = 0;

async function readKey(key) {
  const target = BASE + '/' + encodeURIComponent(key);
  try {
    const r = await fetch(target, {signal: AbortSignal.timeout(4000)});
    if (r.ok) { const t = await r.text(); return parseVal(t); }
  } catch(_){}
  for (let i = 0; i < PROXIES.length; i++) {
    const idx = (pIdx + i) % PROXIES.length;
    try {
      const r = await fetch(PROXIES[idx](target), {signal: AbortSignal.timeout(7000)});
      if (!r.ok) continue;
      const t = await r.text();
      pIdx = idx;
      if (idx === 3) {
        try { const j = JSON.parse(t); return parseVal(j.contents); } catch(_){ continue; }
      }
      return parseVal(t);
    } catch(_){}
  }
  throw new Error('读取失败');
}

function parseVal(text) {
  if (!text || text === 'Not Found' || text === 'null') return null;
  try { return JSON.parse(text); } catch { return text; }
}

// ===== [7] Cookie 记录用户名 =====
function setCookie(name, val, days) {
  const d = new Date();
  d.setTime(d.getTime() + days * 86400000);
  document.cookie = name + '=' + encodeURIComponent(val) + ';expires=' + d.toUTCString() + ';path=/';
}
function getCookie(name) {
  const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return m ? decodeURIComponent(m[2]) : '';
}

// ===== [5] 弹窗工具 =====
function showModal(title, fields, onConfirm, confirmText, confirmCls) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  let fieldsHtml = '';
  fields.forEach(f => {
    fieldsHtml += `<div class="m-fg"><label>${f.label}</label><input id="modal_${f.id}" type="${f.type||'text'}" placeholder="${f.placeholder||''}" value="${f.value||''}"></div>`;
  });
  overlay.innerHTML = `<div class="modal-box"><h3>${title}</h3>${fieldsHtml}<div class="m-btns"><button class="m-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button><button class="${confirmCls||'m-confirm'}" id="modalConfirmBtn">${confirmText||'确认'}</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#modalConfirmBtn').addEventListener('click', () => {
    const vals = {};
    fields.forEach(f => { vals[f.id] = overlay.querySelector('#modal_' + f.id).value; });
    overlay.remove();
    onConfirm(vals);
  });
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

async function initOwner() {

  try {

    if (owner && typeof owner === 'string' && owner.length > 0) {
      roomOwner = owner;

    } else {

async function checkKickStatus() {
  try {
    const kicks = await readKey(getKickKey());
    if (kicks && typeof kicks === 'object' && kicks[nick]) {
      const expiry = kicks[nick];
      if (Date.now() < expiry) {

      } else {
        delete kicks[nick];
        await writeKV(getKickKey(), JSON.stringify(kicks));

    const mutes = await readKey(getMuteKey());

      const expiry = mutes[nick];
      if (Date.now() < expiry) {

        applyMuteUI();
        return;
      } else {
        delete mutes[nick];
        await writeKV(getMuteKey(), JSON.stringify(mutes));
      }
    }
  } catch(_){}
  muteUntil = 0;

function applyMuteUI() {
  const ta = $('iMsg');
  ta.disabled = true;
  ta.classList.add('muted');
  $('btnS').disabled = true;
  const update = () => {
    if (muteUntil <= Date.now()) { removeMuteUI(); return; }
    const remain = muteUntil - Date.now();
    const mins = Math.floor(remain / 60000);
    const secs = Math.floor((remain % 60000) / 1000);
    ta.placeholder = `你已被禁言 · 解禁: ${mins}分${secs}秒后`;
  };
  update();
  if (muteCheckTimer) clearInterval(muteCheckTimer);
  muteCheckTimer = setInterval(update, 1000);
}

function removeMuteUI() {
  const ta = $('iMsg');
  ta.disabled = false;
  ta.classList.remove('muted');
  ta.placeholder = '输入消息… Enter 发送';
  $('btnS').disabled = false;
  if (muteCheckTimer) { clearInterval(muteCheckTimer); muteCheckTimer = null; }
}

async function recallMsg(msgId) {
  try {
    const msg = cache[msgId];
    if (!msg) { toast('无法找到该消息', 'err'); return; }
    if (!isAdmin && msg.u !== nick) { toast('只能撤回自己的消息', 'err'); return; }
    if (!isAdmin && (Date.now() - msg.t > RECALL_LIMIT)) { toast('超过1分钟，无法撤回', 'err'); return; }

    let ids = [];
    try { const cur = await readKey(idxKey); if (Array.isArray(cur)) ids = cur; } catch(_){}
    const newIds = ids.filter(id => id !== msgId);
    await writeKV(idxKey, JSON.stringify(newIds));
    delete cache[msgId];
    lastSig = '';
    poll();
    toast('消息已撤回', 'ok');
  } catch(e) { toast('撤回失败: ' + e.message, 'err'); }
}

async function refreshData() {
  if (!isInRoom) return;
  try {
    const index = await readKey(idxKey);
    if (Array.isArray(index) && index.length > 0) {
      await writeKV(idxKey, JSON.stringify(index));
    }
    await updatePresence();
  } catch(_){}
}

// ===== [8] 被踢出/封禁实时检测 =====
async function checkForceKick() {
  if (!isInRoom) return;
  try {
       {
      const kicks = await readKey(getKickKey());
      if (kicks && typeof kicks === 'object' && kicks[nick]) {
        if (Date.now() < kicks[nick]) {
          toast('你已被踢出' + (isHall ? '大厅' : '房间'), 'err');
          doLeave();
          return;
        }
      }
    }

    const bans = await readKey(getBanKey());
    if (bans && typeof bans === 'object' && bans[nick]) {
      if (Date.now() < bans[nick]) {
        toast('你已被封禁', 'err');
        doLeave();
        return;
      }
    }
    await checkMuteStatus();
  } catch(_){}
}

// ===== LOBBY =====
async function join() {
  const n = $('iNick').value.trim();
  const r = $('iRoom').value.trim();
  const p = $('iPass').value.trim();
  const ap = $('iAdmin').value.trim();

  if (!n) { toast('请输入昵称','err'); return; }
  if (hasInvalidNickChars(n)) { toast('昵称包含非法字符，请修改','err'); return; }
  if (!r) { toast('请输入房间号','err'); return; }
  if (r === HALL_ROOM_ID) { toast('无效的房间号','err'); return; }

  isAdmin = (ap === ADMIN_PASS);
  nick = n;
  room = r;
  isHall = false;
  idxKey = PREFIX + r.replace(/[^0-9a-zA-Z\-_]/g,'x').slice(0,30);
  presenceKey = idxKey + '_presence';
  passKey = idxKey + '_pass';
  color = hc(nick);

 

  $('btnGo').disabled = true;
  $('btnGo').textContent = '进入中…';

  try {
    const canBan = await checkBanStatus();
    if (!canBan) { $('btnGo').disabled = false; $('btnGo').textContent = '进入房间 →'; return; }

    const canKick = await checkKickStatus();
    if (!canKick) { $('btnGo').disabled = false; $('btnGo').textContent = '进入房间 →'; return; }

    let presenceData = null;
    try { presenceData = await readKey(presenceKey); } catch(_){}
    if (presenceData && typeof presenceData === 'object' && !Array.isArray(presenceData)) {
      const now = Date.now();
      for (const k in presenceData) { if (now - presenceData[k] > PRESENCE_TIMEOUT) delete presenceData[k]; }
      if (presenceData[nick]) {
        if (now - presenceData[nick] <= PRESENCE_TIMEOUT) {
          toast('昵称 "' + nick + '" 已被占用，请换一个','err');
          $('btnGo').disabled = false; $('btnGo').textContent = '进入房间 →'; return;
        }
        delete presenceData[nick];
      }
    }

    let storedHash = null;
    try { storedHash = await readKey(passKey); } catch(_){}
    if (storedHash && typeof storedHash === 'string' && storedHash.length > 0) {
      roomHasPass = true;
      if (!p) { toast('该房间已设置密码，请输入密码','err'); $('btnGo').disabled = false; $('btnGo').textContent = '进入房间 →'; $('iPass').focus(); return; }
      if (hashPass(p) !== storedHash) { toast('密码错误，无法加入房间','err'); $('btnGo').disabled = false; $('btnGo').textContent = '进入房间 →'; return; }
    } else {
      roomHasPass = false;
      if (p) { await writeKV(passKey, hashPass(p)); roomHasPass = true; toast('房间密码已设置','ok'); }
    }

    await initOwner();
    await checkMuteStatus();

    isInRoom = true;
    prevOnlineSet = new Set();
    joinMsgPending = true;
    enterChat();
  } catch(e) {
    toast('连接失败: ' + e.message, 'err');
    $('btnGo').disabled = false; $('btnGo').textContent = '进入房间 →';
  }
}

  const ap = $('iAdmin').value.trim();

  if (!n) { toast('请输入昵称','err'); return; }

  isHall = true;

  passKey = idxKey + '_pass';
  color = hc(nick);

  $('btnHall').disabled = true;
  $('btnHall').textContent = '进入中…';

   try {
    const canBan = await checkBanStatus();

    const canKick = await checkKickStatus();
    if (!canKick) { $('btnHall').disabled = false; $('btnHall').textContent = ' 进入大厅 →'; return; }

    let presenceData = null;

    try { presenceData = await readKey(presenceKey); } catch(_){}
    if (presenceData && typeof presenceData === 'object' && !Array.isArray(presenceData)) {
      const now = Date.now();
      for (const k in presenceData) { if (now - presenceData[k] > PRESENCE_TIMEOUT) delete presenceData[k]; }
      if (presenceData[nick]) {
        if (now - presenceData[nick] <= PRESENCE_TIMEOUT) {
          toast('昵称 "' + nick + '" 已被占用，请换一个','err');

        }
        delete presenceData[nick];
      }

    prevOnlineSet = new Set();
    joinMsgPending = true;

function enterChat() {
  $('lobby').classList.remove('on');
  $('chat').classList.add('on');

  if (isHall) { $('cName').textContent = '大厅'; $('cIco').textContent = '🏠'; }
  else {
    const lockIcon = roomHasPass ? ' 🔒' : '';
    $('cName').textContent = '# ' + room + lockIcon;
    $('cIco').textContent = room[0].toUpperCase();
  }

  $('cMeta').textContent = '加载中…';
  lastSig = ''; cache = {}; msgIdMap = [];

  updatePresence();
  poll();
  timer = setInterval(poll, POLL_MS);
  hbTimer = setInterval(updatePresence, HEARTBEAT_MS);
  refreshTimer = setInterval(refreshData, REFRESH_INTERVAL);
}

function leaveConfirm() {
  if (isHall) { doLeave(); return; }
  const cnt = getOnlineCount();
  let msg;
  if (cnt > 1) msg = '你将会离开房间！确定退出吗？';
  else msg = '房间将关闭并清除数据！确定退出吗？';
  if (confirm(msg)) doLeave();
}

async function doLeave() {
  const wasHall = isHall;
  isInRoom = false;
  clearInterval(timer); timer = null;
  clearInterval(hbTimer); hbTimer = null;
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  if (muteCheckTimer) { clearInterval(muteCheckTimer); muteCheckTimer = null; }
  await removeFromPresence(wasHall);
  $('chat').classList.remove('on');
  $('lobby').classList.add('on');
  $('btnGo').disabled = false; $('btnGo').textContent = '进入房间 →';
  $('btnHall').disabled = false; $('btnHall').textContent = ' 进入大厅 →';
  $('msgs').innerHTML = '<div class="empty"><div class="ic">🌌</div><p>暂无消息</p></div>';
  $('onlineCnt').textContent = '0';
  $('onlineList').innerHTML = '';
  onlineUsers = {};
  prevOnlineSet = new Set();
  roomHasPass = false;
  isHall = false;
  joinMsgPending = false;
  isAdmin = false;
  isOwner = false;
  roomOwner = '';
  muteUntil = 0;
  removeMuteUI();
}

// ===== POLL =====
async function poll() {
  try {
    const index = await readKey(idxKey);
    const ids = Array.isArray(index) ? index : [];
    const sig = ids.length + ':' + (ids[ids.length-1]||'');
    if (sig !== lastSig) {
      lastSig = sig;
      const recent = ids.slice(-MAX_MSG);
      const missing = recent.filter(id => !cache[id]);
      for (let i = 0; i < missing.length; i += 5) {
        const batch = missing.slice(i, i+5);
        const results = await Promise.allSettled(batch.map(id => readKey(id)));
        results.forEach((r, j) => {
          if (r.status === 'fulfilled' && r.value) cache[batch[j]] = r.value;
        });
      }
      const msgs = [];
      const mIds = [];
      for (const id of recent) {
        if (cache[id]) { msgs.push(cache[id]); mIds.push(id); }
      }
      msgIdMap = mIds;
      render(msgs);
      $('cMeta').textContent = msgs.length + ' 条消息 · 轮询中';
    }

    if (joinMsgPending) {
      joinMsgPending = false;
      const joinText = isHall ? (nick + ' 进入了大厅') : (nick + ' 加入了房间');
      const msgId = rnd(24);
      const body = JSON.stringify({ sys: joinText, temp: true, t: Date.now() });
      await writeKV(msgId, body);
      let ids2 = [];
      try { const cur = await readKey(idxKey); if (Array.isArray(cur)) ids2 = cur; } catch(_){}
      ids2.push(msgId);
      if (ids2.length > MAX_MSG) ids2 = ids2.slice(ids2.length - MAX_MSG);
      await writeKV(idxKey, JSON.stringify(ids2));
      lastSig = '';
    }

    readPresence();
    checkForceKick();
  } catch(e) {
    $('cMeta').textContent = '连接中… 重试';
    if (joinMsgPending) {
      joinMsgPending = false;
      appendTempSysMsg(isHall ? (nick + ' 进入了大厅') : (nick + ' 加入了房间'));
    }
  }
}

// ===== RENDER =====
function render(msgs) {
  const w = $('msgs');
  const atBot = w.scrollHeight - w.scrollTop - w.clientHeight < 50;

  const validMsgs = [];
  const validIds = [];
  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i];
    if (!m || typeof m !== 'object') continue;
    if (m.sys) {
      if (m.temp && m.t && (Date.now() - m.t > 3500)) continue;
      validMsgs.push(m); validIds.push(msgIdMap[i] || ''); continue;
    }
    if (typeof m.u !== 'string' || m.u === '') continue;
    if (typeof m.x !== 'string') continue;
    if (typeof m.t !== 'number' || isNaN(m.t)) continue;
    validMsgs.push(m);
    validIds.push(msgIdMap[i] || '');
  }

  if (!validMsgs.length) {
    w.innerHTML = '<div class="empty"><div class="ic">🌌</div><p>暂无消息，说点什么吧</p></div>';
    return;
  }

  let h = '', la = null, lt = 0;
  for (let i = 0; i < validMsgs.length; i++) {
    const m = validMsgs[i];
    const mid = validIds[i];

    if (m.sys) {
      if (m.temp) {
        h += `<div class="temp-sys"><span>${esc(m.sys)}</span></div>`;
      } else {
        h += `<div class="m sys"><span>${esc(m.sys)}</span></div>`;
      }
      la = null; continue;
    }

    const c = m.c || hc(m.u || '?');
    const decodedText = safeDecode(m.x || '');
    const ts = typeof m.t === 'number' ? m.t : Date.now();
    const grp = (m.u === la) && (ts - lt < 90000);

    const isMsgAdmin = (m.a === true || m.a === 1);
    const devBadge = isMsgAdmin ? '<span class="dev-badge">[Dev]</span> ' : '';

    let ownerBadge = '';
    if (!isHall && m.u === roomOwner) {
      ownerBadge = '<span class="owner-badge">[房主]</span> ';
    }

    if (!grp) {
      h += `<div class="m" data-msgid="${mid}" data-user="${esc(m.u)}" data-ts="${ts}"><div class="av" style="background:${c}">${esc((m.u||'?')[0].toUpperCase())}</div><div class="bd"><div class="hd">${devBadge}${ownerBadge}<span class="au" style="color:${c}">${esc(m.u)}</span><span class="tm">${ft(ts)}</span></div><div class="tx">${esc(decodedText)}</div></div></div>`;
    } else {
      h += `<div class="m" style="padding-left:46px" data-msgid="${mid}" data-user="${esc(m.u)}" data-ts="${ts}"><div class="bd"><div class="tx">${esc(decodedText)}</div></div></div>`;
    }
    la = m.u; lt = ts;
  }
  w.innerHTML = h;
  if (atBot) w.scrollTop = w.scrollHeight;

  bindCtxMenus();
}

// ===== 右键菜单绑定 =====
function bindCtxMenus() {
  const w = $('msgs');
  const msgEls = w.querySelectorAll('.m[data-user]');
  msgEls.forEach(el => {
    el.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const targetUser = this.getAttribute('data-user');
      const msgId = this.getAttribute('data-msgid');
      const msgTs = parseInt(this.getAttribute('data-ts')) || 0;

      const items = [];

      if (isAdmin) {
        if (msgId) {
          items.push({ icon: '', text: '撤回此消息', cls: 'warn', action: () => adminDeleteMsg(msgId) });
        }
        if (targetUser !== nick) {
          items.push({ sep: true });
          items.push({ icon: '', text: '踢出 ' + targetUser, cls: 'danger', action: () => adminKickUser(targetUser) });
          items.push({ icon: '', text: '封禁 ' + targetUser, cls: 'danger', action: () => adminBanUser(targetUser) });
          items.push({ icon: '', text: '警告 ' + targetUser, cls: 'warn', action: () => adminWarnUser(targetUser) });
          items.push({ icon: '', text: '禁言 ' + targetUser, cls: 'warn', action: () => adminMuteUser(targetUser) });
          items.push({ icon: '', text: '解除禁言', action: () => adminUnmuteUser(targetUser) });
        }
      } else if (isOwner && !isHall) {
        if (targetUser !== nick) {
          items.push({ icon: '🚫', text: '踢出 ' + targetUser, cls: 'danger', action: () => ownerKickUser(targetUser) });
        }
        if (msgId && targetUser === nick && (Date.now() - msgTs <= RECALL_LIMIT)) {
          items.push({ icon: '↩️', text: '撤回消息', action: () => recallMsg(msgId) });
        }
      } else {
        if (targetUser === nick && msgId && (Date.now() - msgTs <= RECALL_LIMIT)) {
          items.push({ icon: '↩️', text: '撤回消息', action: () => recallMsg(msgId) });
        }
      }

      if (items.length > 0) {
        showCtxMenu(e.clientX, e.clientY, items);
      }
    });
  });
}

// ===== SEND =====
function hk(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } }

async function send() {
  if (muteUntil > Date.now()) {
    toast('你已被禁言，无法发送消息', 'err');
    return;
  }

  const txt = $('iMsg').value.trim();
  if (!txt || busy) return;
  if (txt.length > 400) { toast('消息最长 400 字符','err'); return; }

  busy = true;
  $('btnS').disabled = true;

  try {
    const msgId = rnd(24);
    const encodedTxt = encodeURIComponent(txt);
    const msgObj = { u:nick, x:encodedTxt, t:Date.now(), c:color };
    if (isAdmin) msgObj.a = true;
    const body = JSON.stringify(msgObj);
    await writeKV(msgId, body);

    let ids = [];
    try { const cur = await readKey(idxKey); if (Array.isArray(cur)) ids = cur; } catch(_){}
    ids.push(msgId);
    if (ids.length > MAX_MSG) ids = ids.slice(ids.length - MAX_MSG);
    await writeKV(idxKey, JSON.stringify(ids));

    cache[msgId] = msgObj;
    $('iMsg').value = '';
    $('iMsg').style.height = 'auto';
    lastSig = '';
    poll();
  } catch(e) {
    toast('发送失败: ' + e.message, 'err');
  }
   busy = false;
  $('btnS').disabled = false;
  $('iMsg').focus();
}

$('iPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('iAdmin').focus()});
$('iAdmin').addEventListener('keydown',e=>{if(e.key==='Enter')join()});

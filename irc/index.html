<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在为你加载精彩内容</title>
    <!-- 核心跳转代码：content="0" 表示0秒后跳转 -->
    <meta http-equiv="refresh" content="0;url=https://www.bilibili.com/video/BV1eJuG6nESA">
</head>
<body>
    <p></p>
    <p>如果页面没有自动跳转，请 <a href="https://www.bilibili.com/video/BV1eJuG6nESA">点击这里</a>。</p>
    
    <!-- 备用方案：使用 JavaScript 跳转，防止 meta 标签被某些浏览器拦截 -->
    <script>
        window.location.href = "https://www.bilibili.com/video/BV1eJuG6nESA";
    </script>
</body>
</html>
